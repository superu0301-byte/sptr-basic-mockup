<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Basic Member System — Mockup</title>
<style>
:root{--ink:#1d2433;--ink2:#5b6475;--mut:#8a92a3;--line:#e3e7ee;--bg:#f4f6f9;--navy:#14213d;--acc:#0f7a55}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Leelawadee UI","Leelawadee","Thonburi","Sukhumvit Set",Tahoma,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;min-width:1180px}
button{font-family:inherit;font-size:13.5px;cursor:pointer;border-radius:8px;border:1px solid #cfd6e0;background:#fff;color:var(--ink);padding:6px 12px;line-height:1.35}
button:hover{border-color:#9aa6b8;background:#f8fafc}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff}
button.pri:hover{background:#22335a}
button.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
button.jump{font-size:12.5px;padding:4px 10px;border-radius:999px;background:#f1f4f8;border-color:#e0e5ec}
input[type=text],textarea,select{font-family:inherit;font-size:14px;border:1px solid #cfd6e0;border-radius:8px;padding:7px 10px;color:var(--ink);background:#fff}
textarea{width:100%;resize:vertical;min-height:64px}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
#side{background:var(--navy);color:#dfe6f3;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-size:18px;font-weight:700;color:#fff;padding:0 8px 6px;line-height:1.3}
.logo small{display:block;font-size:12px;font-weight:400;color:#9fb0cc}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:transparent;border:none;color:#c9d3e6;padding:9px 10px;border-radius:8px;font-size:14.5px}
.nav:hover{background:#1f2f52;color:#fff}
.nav.on{background:#2a3d66;color:#fff;font-weight:700}
.nav .cnt{font-size:11.5px;background:#fab219;color:#3d2a00;border-radius:999px;padding:1px 8px;font-weight:700}
.sec{font-size:11.5px;color:#7f90ad;margin:14px 10px 4px}
#side select{width:100%;border-color:#33466e;background:#1b2b4d;color:#fff}
.sfoot{margin-top:auto;font-size:11.5px;color:#7f90ad;line-height:1.55;padding:0 8px}
main{min-width:0}
#top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.simlbl{font-size:12px;color:var(--ink2)}
.simdate{font-weight:700;font-size:15.5px;color:var(--navy);margin-right:6px}
.mockflag{margin-left:auto;font-size:12px;font-weight:700;color:#7a5200;background:#fff4d6;border:1px solid #f0d58f;border-radius:999px;padding:4px 10px}
#view{padding:22px 24px 48px}
h1{font-size:24px;margin:0 0 2px;color:var(--navy)}
.sub{color:var(--ink2);margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.grid{display:grid;gap:14px}
.muted{color:var(--mut)}
.note{font-size:12.5px;color:var(--ink2);line-height:1.5}
.kpi .lb{font-size:12.5px;color:var(--ink2)}
.kpi .vl{font-size:26px;font-weight:700;color:var(--navy);line-height:1.25}
.kpi .dl{font-size:12.5px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid #dde2ea;background:#fff;white-space:nowrap;color:var(--ink);vertical-align:1px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:#f1f4f8;color:var(--ink2);margin:0 4px 4px 0}
.tag.ft{background:#efeafd;color:#4a2fa8;font-weight:700}
.grp{font-size:13.5px;font-weight:700;margin:4px 0 2px;display:flex;align-items:center;gap:8px;color:var(--navy)}
.grp .n{font-weight:400;color:var(--ink2)}
.task{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eef1f5}
.task:last-child{border-bottom:none}
.nm{font-weight:700;color:var(--navy);cursor:pointer}
.nm:hover{text-decoration:underline}
.task .tt{font-size:14px;margin-top:2px}
.task .ss{font-size:12.5px;color:var(--ink2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;margin-bottom:10px;border:1px solid}
.banner.cls{background:#e8f0fd;border-color:#c5d7f7;color:#173f86}
.banner.rep{background:#e8f5ee;border-color:#a9dcc0;color:#0b5c40}
.banner.cb{background:#fff4d6;border-color:#f0d58f;color:#7a5200}
.banner .sp{margin-left:auto}
.hint{background:#efeafd;border:1px solid #d9d2f6;border-radius:14px;padding:14px 16px;color:#2e1f73}
.hint b{color:#2e1f73}
.hint ul{margin:6px 0 0;padding-left:18px}
.hint li{margin-bottom:6px;font-size:13.5px;line-height:1.5}
.empty{color:var(--mut);font-size:13.5px;padding:8px 0}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fchip{border-radius:999px;font-size:12.5px;padding:4px 11px}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;margin-bottom:16px}
.tile{border-radius:10px;padding:9px 11px;border:1px solid;cursor:pointer;min-height:70px}
.tile:hover{filter:brightness(.97)}
.tile b{display:block;font-size:14px}
.tile span{display:block;font-size:12px;line-height:1.45}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eef1f5;font-size:13.5px;vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:700;background:#f6f8fb}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8fafc}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border-radius:10px;padding:8px 10px;font-size:12.5px;border:1px solid var(--line);background:#f6f8fb;color:var(--ink2)}
.step b{display:block;font-size:13.5px;color:var(--ink)}
.step.done{background:#e8f5ee;border-color:#a9dcc0;color:#237a55}
.step.cur{background:#fff;border-color:var(--navy);border-width:2px;color:var(--navy)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed #eef1f5;font-size:13px}
.tl li:last-child{border-bottom:none}
.tl .d{color:var(--mut)}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kcol{background:#eef1f6;border-radius:14px;padding:10px;min-height:150px}
.kcol h4{margin:2px 4px 8px;font-size:13.5px;color:var(--navy);display:flex;justify-content:space-between}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer;font-size:12.5px;line-height:1.5}
.kcard.sel{border-color:#6f4bd8;border-width:2px}
.kcard b{font-size:13.5px;color:var(--navy)}
.ck{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px;cursor:pointer}
.ck input{width:16px;height:16px}
.fsec{border-top:1px solid #eef1f5;padding:10px 0}
.fsec h4{margin:0 0 4px;font-size:14px;color:var(--navy);display:flex;justify-content:space-between}
.res{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.res.ok{background:#e8f5ee;color:#0b5c40;border:1px solid #a9dcc0}
.res.no{background:#fbe9e9;color:#8f1f1f;border:1px solid #f1bcbc}
.res.wait{background:#f6f8fb;color:var(--ink2);border:1px solid var(--line)}
.err{color:#b42318;font-size:13px;margin-top:4px}
.stage{display:flex;align-items:center;gap:6px}
.stg{flex:1;text-align:center;background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:6px 4px}
.stg .n{font-size:21px;font-weight:700;color:var(--navy)}
.stg .t{font-size:12px;color:var(--ink2)}
.stage .a{color:#a0a8b6;font-size:12px}
.voice{border-bottom:1px solid #eef1f5;padding:9px 0;font-size:13.5px}
.voice:last-child{border-bottom:none}
.phone{width:352px;height:690px;border-radius:38px;background:#161a22;padding:12px;flex:none}
.pscreen{background:#fff;border-radius:28px;height:100%;overflow:hidden;display:flex;flex-direction:column}
.phead{background:#1f2f52;color:#fff;padding:16px 16px 10px;font-weight:700;font-size:14.5px}
.phead small{display:block;font-weight:400;font-size:11.5px;color:#b8c4db}
.lchat{background:#8fb0dc;flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.lchat>*{flex-shrink:0}
.bub{max-width:84%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.55;background:#fff;color:#111;align-self:flex-start}
.bub.me{background:#c8f5b0;align-self:flex-end}
.lday{align-self:center;font-size:11px;background:rgba(0,0,0,.2);color:#fff;border-radius:999px;padding:2px 10px}
.lbtn{display:block;margin:8px 0 4px;text-align:center;background:#06c755;color:#fff;border-radius:8px;padding:7px;font-weight:700;border:none;width:100%;font-size:13px}
.lbtn:hover{background:#05b34c}
.lcard{align-self:flex-start;width:84%;background:#fff;border-radius:16px;overflow:hidden;font-size:13px}
.lcard .hd{padding:12px 14px;color:#fff}
.lcard .bd{padding:10px 14px;line-height:1.55}
.pinput{background:#fff;border-top:1px solid #e6e9ef;padding:11px 14px;font-size:12.5px;color:#9aa1ab}
.qz{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto}
.qopt{text-align:left;padding:10px 12px;border-radius:10px;font-size:13.5px}
.qopt.on{border-color:#06c755;background:#e9faf0;color:#05652d;font-weight:700}
.qbar{height:5px;background:#eef1f5;border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:#06c755}
.web{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.wbar{background:#eef1f6;padding:8px 12px;font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.wbar .u{background:#fff;border-radius:6px;padding:3px 10px;flex:1}
.wbody{padding:18px 20px}
.modal{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:16px;width:500px;max-width:92vw;padding:18px 20px}
.mhead{font-weight:700;font-size:16px;color:var(--navy);margin-bottom:10px}
.mchat{background:#8fb0dc;border-radius:12px;padding:12px;margin-bottom:8px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
#tip{position:fixed;display:none;background:var(--navy);color:#fff;font-size:12.5px;padding:5px 9px;border-radius:6px;pointer-events:none;z-index:70}
.sla{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-top:4px;border:1px solid}
.sla.ok{background:#f6f8fb;border-color:var(--line);color:var(--ink2)}
.sla.due{background:#fff4d6;border-color:#f0d58f;color:#7a5200}
.sla.late{background:#fbe9e9;border-color:#f1bcbc;color:#8f1f1f}
.rec{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eef1f5}
.rec:last-child{border-bottom:none}
.rec .why{font-size:12.5px;color:var(--ink2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);margin:-6px 0 14px}
.flow b{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--navy);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main>
    <header id="top"></header>
    <div id="view"></div>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<div id="tip"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_DS = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const HOUR = 3600e3, DAY = 24 * HOUR;
const BASE = new Date(2026, 8, 23, 18, 0);
const at = (off, h = 10, mi = 0) => new Date(2026, 8, 23 + off, h, mi);
const dOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function addMonths(d, n) { const y = d.getFullYear(), m = d.getMonth() + n, last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(d.getDate(), last), d.getHours(), d.getMinutes()); }
function monthsSince(a, t) { a = dOnly(a); t = dOnly(t); let n = (t.getFullYear() - a.getFullYear()) * 12 + (t.getMonth() - a.getMonth()); if (addMonths(a, n) > t) n--; return Math.max(0, n); }
const daysSince = (a, t) => Math.round((dOnly(t) - dOnly(a)) / DAY);
const hrs = (a, t) => (t - a) / HOUR;
const fd = d => `${d.getDate()} ${TH_M[d.getMonth()]}`;
const fdy = d => `${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear() + 543}`;
const fdl = d => `${TH_D[d.getDay()]} ${fdy(d)}`;
const ftm = d => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const fnum = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
const sameDay = (a, b) => a && b && dOnly(a).getTime() === dOnly(b).getTime();

/* ============ meta ============ */
const EPN = {1:'EP.1', 2:'EP.2', 3:'EP.3', 4:'EP.4'};
const EPF = {1:'EP.1 หุ้นเบื้องต้น + เครื่องมือ', 2:'EP.2 Dow Theory + แนวรับแนวต้าน', 3:'EP.3 Money Management', 4:'EP.4 Volume + Indicators'};
const TYPES = [
  {name:'สายเฝ้าจอ', en:'Day trader', tip:'จับจังหวะระหว่างวันด้วยแนวรับแนวต้าน (EP.2) และ Volume (EP.4)', c:'#d85a30'},
  {name:'สายหลังเลิกงาน', en:'Swing trader', tip:'ดูกราฟรายวันตอนเย็น วางแผนล่วงหน้า EP.3 คือหัวใจ', c:'#185fa5'},
  {name:'สายถือยาว', en:'Position trader', tip:'อ่านภาพใหญ่ด้วย Dow Theory (EP.2) คุมความเสี่ยงด้วย EP.3', c:'#0f6e56'},
];
const SCREEN = ['เฝ้าจอได้ทั้งวัน','ดูได้ช่วงพัก / หลังเลิกงาน','แทบไม่มีเวลาดูจอ'];
const LEVEL = ['ไม่เคยเรียนเทรด','รู้จักชื่อ Indicator','ใช้ Indicator จริง','เรียนมาหลายคอร์ส'];
const ASSETS = ['หุ้นไทย','หุ้นต่างประเทศ','TFEX','ทอง','คริปโต'];
const ST = {
  down:{name:'Downtrend', th:'ยังไม่เริ่มเรียน', c:'#d03b3b', bg:'#fbe9e9', tx:'#8f1f1f'},
  side:{name:'Sideway', th:'ค้างบทเดิม', c:'#fab219', bg:'#fff4d6', tx:'#7a5200'},
  cs:{name:'ส่ง CS', th:'ไม่ตอบเกิน 24 ชม.', c:'#ec835a', bg:'#fdeee6', tx:'#8a3a17'},
  stop:{name:'Stop loss', th:'ติดต่อไม่ได้ 3 เดือน', c:'#3a3f47', bg:'#e4e6ea', tx:'#1d2433'},
  ipo:{name:'IPO', th:'สมัครใหม่ ยังไม่ทัก', c:'#2f6fdb', bg:'#e7effc', tx:'#173f86'},
  pend:{name:'Pending order', th:'ทักแล้ว รอตอบ', c:'#7a8699', bg:'#eef0f3', tx:'#3b4556'},
  gap:{name:'Gap up', th:'อยู่ใน Fast Track', c:'#6f4bd8', bg:'#efeafd', tx:'#3a2690'},
  up:{name:'Uptrend', th:'กำลังเรียน', c:'#0ca30c', bg:'#e6f5e6', tx:'#0b5c0b'},
  sp:{name:'SP', th:'พักการเรียน', c:'#9aa1ab', bg:'#f1f2f4', tx:'#4b525c'},
  tp:{name:'Take profit', th:'จบ / ไป Advance', c:'#c99400', bg:'#fbf3d9', tx:'#6b4f00'},
};
const ST_ORDER = ['down','side','cs','stop','ipo','pend','gap','up','sp','tp'];
const COACHES = ['แนน','บีม','ต้น'];
const QUIZ = [
  {q:'ปกติดูกราฟได้ช่วงไหน', o:SCREEN},
  {q:'รู้จัก Indicator แค่ไหน', o:LEVEL},
  {q:'สนใจสินทรัพย์อะไรที่สุด', o:ASSETS},
  {q:'สะดวกมาเรียน onsite ที่ กทม. ไหม', o:['สะดวก','ไม่สะดวก']},
];
const VOICE = [
  {tag:'เนื้อหา', text:'อยากให้มีตัวอย่างหุ้นจริงเยอะๆ ในคลาสวันเสาร์', act:'เพิ่มช่วง Case Clinic 30 นาที'},
  {tag:'ตารางเรียน', text:'คลาสวันพุธเลิกดึกไปนิด ถ้าเริ่มเร็วขึ้นได้จะดีมาก', act:'เสนอหัวหน้าพิจารณาเวลาเริ่มคลาส'},
  {tag:'โค้ช', text:'ชอบที่โค้ชตรวจการบ้านละเอียด อธิบายเข้าใจง่าย', act:'แชร์ในทีมโค้ช'},
];

/* ============ class cycle (4 weeks, Wed + Sat) ============ */
const CYCLE0 = new Date(2026, 8, 7);
function cycleEP(d) { const w = Math.floor(Math.round((dOnly(d) - CYCLE0) / DAY) / 7); return ((w % 4) + 4) % 4 + 1; }
function classOn(d) {
  const wd = d.getDay(); if (wd !== 3 && wd !== 6) return null;
  const ep = cycleEP(d);
  const label = ep === 1 ? (wd === 3 ? 'EP.1.1 หุ้นเบื้องต้น + Streaming' : 'EP.1.2 TradingView + E Fin Stock Pickup') : EPF[ep];
  return {ep, label, day: wd === 3 ? 'พุธ' : 'เสาร์', kind: wd === 3 ? 'ตลาดจริง' : 'Case Clinic'};
}
function nextClass(ep, t) { let d = dOnly(t); for (let i = 0; i < 40; i++) { const c = classOn(d); if (c && (!ep || c.ep === ep)) return {date: new Date(d), ...c}; d = addDays(d, 1); } return null; }
const nextC = (ep, t) => { const c = nextClass(ep, t); return c ? `วัน${c.day} ${fd(c.date)}` : '—'; };

/* ============ mock data (fictional) ============ */
const SEED = [
 {id:'m01', name:'ภัทรา ว.', nick:'ภัทรา', coach:'แนน', join:[-1,19,40]},

    const f = m.ft;
    if (f.status === 'invited') A.push({k:'ftInvite', pri:2, title:'Fast Track: รอนัด Screening', sub:`ประตู ${f.gate}`});
    if (f.status === 'scheduled' && f.screenAt && dOnly(f.screenAt) <= dOnly(t)) A.push({k:'ftScreen', pri:0, title:'ถึงวันนัด Screening Fast Track', sub:`${f.channel || 'online'} · ${fd(f.screenAt)} ${ftm(f.screenAt)} น.`});
    if ((f.status === 'hw' || f.status === 'clip') && f.hwSub && f.hwSub <= t) { const hh = hrs(f.hwSub, t); A.push({k:'ftHw', pri: hh >= 48 ? 0 : 2, title: hh >= 48 ? 'การบ้าน Fast Track ค้างตรวจเกิน 48 ชม.' : 'การบ้าน Fast Track รอตรวจ', sub:`ส่งมา ${Math.floor(hh)} ชม. · หุ้น ${esc(f.stock || '-')}`}); }
  }
  return A;
}
function infoOf(m, t, st) {
  const cur = lessonAt(m, t);
  switch (st) {
    case 'ipo': return `สมัครมา ${Math.floor(hrs(m.join, t))} ชม.`;
    case 'pend': return `ทักแล้ว ${Math.floor(hrs(m.contact, t))} ชม.`;
    case 'cs': return `ไม่ตอบ ${Math.floor(hrs(m.contact, t))} ชม.`;
    case 'stop': return `ไม่ตอบ ${daysSince(lastReplyAt(m, t), t)} วัน`;
    case 'sp': return `พักที่ ${EPN[m.pause.ep]} · ${daysSince(m.pause.start, t)} วัน`;
    case 'gap': return ({invited:'รอนัด Screening', scheduled: m.ft.screenAt ? `นัด Screening ${fd(m.ft.screenAt)}` : 'นัด Screening', hw:'การบ้าน 3 ส่วน', clip:'คลิป 30 นาที + การบ้าน 1 ข้อ'})[m.ft.status] || 'Fast Track';
    case 'tp': return m.grad && m.grad <= t ? `จบ Basic ${fd(m.grad)}` : 'ไป Advance (Fast Track)';
    default: return cur ? `${EPN[cur.ep]} · ${daysSince(cur.at, t)} วัน` : 'ยังไม่เริ่มบทเรียน';
  }
}

function vToday() {
  const t = now(), list = mine();
  const tasks = []; list.forEach(m => alertsOf(m, t).forEach(a => tasks.push({m, a})));
  const G = [0, 1, 2].map(p => { const g = []; tasks.filter(x => x.a.pri === p).forEach(x => { const e = g.find(y => y.m === x.m); e ? e.as.push(x.a) : g.push({m:x.m, as:[x.a]}); }); return g; });
  const sts = list.map(m => statusOf(m, t));
  const cnt = k => sts.filter(s => s === k).length;
  const act = cnt('up') + cnt('side') + cnt('down');
  const idx = act ? Math.round(cnt('up') / act * 100) : 0;
  const hwN = tasks.filter(x => x.a.k === 'hw' || x.a.k === 'ftHw').length;
  const c = classOn(t), nc = nextClass(null, addDays(t, c ? 1 : 0));
  let banners = '';
  banners += c ? `<div class="banner cls"><b>วันนี้มีคลาสสด</b> วัน${c.day} "${c.kind}" · ${c.label}${c.day === 'พุธ' ? ' · เปิด Streaming ตลาดจริง' : ''}</div>`

  if (t.getDate() === 8) banners += `<div class="banner cb"><b>วันที่ 8 วันคืนสนาม</b> มี สมช พักการเรียน ${list.filter(m => statusOf(m, t) === 'sp').length} คน รอส่ง Comeback pack</div>`;
  const group = (title, color, arr, emptyTxt) => `<div class="card" style="margin-bottom:12px"><div class="grp"><span class="dotl" style="background:${color}"></span>${title} <span class="n">${arr.reduce((n, x) => n + x.as.length, 0)} งาน</span></div>
    ${arr.length ? arr.map(x => taskRow(x.m, x.as)).join('') : `<div class="empty">${emptyTxt}</div>`}</div>`;

/* ============ view: profile ============ */
function chart(m, t) {
  const W = 640, H = 236, L = 86, R = 18, T = 34, Bm = 30;
  const end = m.grad && m.grad <= t ? m.grad : (m.ft && m.ft.status === 'adv' && m.ft.advAt <= t ? m.ft.advAt : t);
  const start = m.join, span = Math.max(DAY, end - start);
  const X = d => L + (W - L - R) * Math.min(1, Math.max(0, (d - start) / span)), Y = v => T + (H - T - Bm) * (1 - v / 5);
  const LV = ['ยังไม่เริ่ม','EP.1','EP.2','EP.3','EP.4','จบ Basic'];
  const st = statusOf(m, t);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟความคืบหน้าบทเรียนของคุณ${esc(m.name)}">`;
  LV.forEach((l, i) => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(i)}" y2="${Y(i)}" stroke="#eef1f5"/><text x="${L - 10}" y="${Y(i) + 4}" text-anchor="end" font-size="11.5" fill="#8a92a3">${l}</text>`; });
  if (m.pause && m.pause.start <= t) { const a = X(m.pause.start), b = X(m.pause.ret && m.pause.ret <= t ? m.pause.ret : end); s += `<rect x="${a}" y="${T}" width="${Math.max(3, b - a)}" height="${H - T - Bm}" fill="#9aa1ab" opacity=".16"/><text x="${a + 6}" y="${T + 14}" font-size="11.5" fill="#4b525c">พักการเรียน</text>`; }
  const n = monthsSince(start, end);
  for (let i = 1; i <= n; i++) { const d = addMonths(dOnly(start), i), x = X(d); s += `<line x1="${x}" x2="${x}" y1="${T - 6}" y2="${H - Bm}" stroke="#c9d1dd" stroke-dasharray="3 4"/><text x="${x}" y="${T - 12}" text-anchor="middle" font-size="11" fill="#8a92a3">เดือน ${i}</text><rect x="${x - 10}" y="${T - 24}" width="20" height="${H - Bm - T + 24}" fill="transparent" data-tip="ครบรอบเดือนที่ ${i} · ${fdy(d)} · ระบบเช็ค Sideway"/>`; }
  s += `<text x="${L}" y="${H - 8}" font-size="11" fill="#8a92a3">สมัคร ${fnum(start)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="11" fill="#8a92a3">${end === t ? 'วันนี้' : 'จบ'} ${fnum(end)}</text>`;
  const pts = [[start, 0]]; m.lessons.forEach(l => { if (l.at <= end) pts.push([l.at, l.ep]); }); if (m.grad && m.grad <= t) pts.push([m.grad, 5]);
  let d = `M${X(pts[0][0])} ${Y(0)}`; for (let i = 1; i < pts.length; i++) d += ` H${X(pts[i][0])} V${Y(pts[i][1])}`; d += ` H${X(end)}`;
  s += `<path d="${d}" fill="none" stroke="#14213d" stroke-width="2" stroke-linejoin="round"/>`;
  pts.slice(1).forEach(([d0, v]) => { const tip = v === 5 ? `จบ Basic · ${fdy(d0)}` : `เข้า ${EPF[v]} · ${fdy(d0)}`; s += `<circle cx="${X(d0)}" cy="${Y(v)}" r="5" fill="#fff" stroke="#14213d" stroke-width="2"/><circle cx="${X(d0)}" cy="${Y(v)}" r="13" fill="transparent" data-tip="${esc(tip)}"/>`; });
  const lv = pts[pts.length - 1][1];
  s += `<circle cx="${X(end)}" cy="${Y(lv)}" r="7" fill="${ST[st].c}" stroke="#fff" stroke-width="2"/><circle cx="${X(end)}" cy="${Y(lv)}" r="14" fill="transparent" data-tip="${esc('สถานะวันนี้: ' + ST[st].name + ' · ' + ST[st].th)}"/>`;
  return s + '</svg>';
}
function timeline(m, t) {
  const ev = [];
  ev.push([m.join, 'สมัครสมาชิก']);
  if (m.contact) ev.push([m.contact, 'โค้ชทักครั้งแรก']);
  if (m.reply) ev.push([m.reply, 'สมช ตอบกลับ']);
  m.lessons.forEach(l => ev.push([l.at, `เข้า ${EPF[l.ep]}`]));
  m.follows.forEach(f => ev.push([f, 'Follow 14 วัน']));
  m.attempts.forEach(a => ev.push([a.at, a.ch === 'LINE' ? 'ส่งไลน์ ไม่ตอบ' : 'โทร ไม่รับสาย']));
  m.hw.forEach(h => { ev.push([h.sub, `ส่งการบ้าน ${EPN[h.ep]} ข้อ ${h.n}`]); if (h.rev) ev.push([h.rev, `โค้ชตรวจ ${EPN[h.ep]} ข้อ ${h.n}: ผ่าน`]); });
  if (m.pause) ev.push([m.pause.start, `พักการเรียน (${m.pause.reason})`]);
  if (m.ft) { ev.push([m.ft.since, `เข้า Fast Track ประตู ${m.ft.gate}`]); if (m.ft.screenAt && m.ft.score) ev.push([m.ft.screenAt, `Screening ได้ ${ftTotal(m.ft.score)}/10`]); if (m.ft.hwSub) ev.push([m.ft.hwSub, 'ส่งการบ้าน Fast Track']); }
  if (m.grad) ev.push([m.grad, 'จบ Basic → Advance']);
  m.adv.calls.forEach(c => ev.push([c.at, c.ch === 'LINE' ? 'CS ส่ง LINE นัดคุยเรื่องโค้ช Advance' : 'CS โทรเรื่องโค้ช Advance · ไม่รับสาย']));
  if (m.adv.talkAt) ev.push([m.adv.talkAt, `CS คุยเรื่องโค้ช Advance · เลือกโค้ช${advC(m.adv.pick).name}`]);

  return ev.filter(e => e[0] && e[0] <= t).sort((a, b) => b[0] - a[0]).slice(0, 12).map(e => `<li><span class="d">${fd(e[0])} ${ftm(e[0])}</span><span>${esc(e[1])}</span></li>`).join('');
}

function ftResult(f) {

  if ((f.status === 'hw' || f.status === 'clip') && f.hwSub && f.hwSub <= t) acts = B('ตรวจผ่าน → ไป Advance', () => { f.status = 'adv'; f.advAt = now(); log(m, 'ตรวจการบ้าน Fast Track ผ่าน · ส่งต่อ Advance'); done(`คุณ${m.nick}ไป Advance แล้ว`); }, 'pri') + B('ส่งกลับให้แก้', () => { f.hwSub = null; log(m, 'ส่งการบ้าน FT กลับให้แก้'); done('ส่งกลับให้แก้แล้ว'); });

    <div class="card"><h3>CS-2 · No Active (ติดต่อไม่ได้ 3 เดือน)</h3><div class="note" style="margin:-4px 0 8px">เกณฑ์ (ข้อเสนอ): ไลน์ 3 ครั้ง + โทร 3 ครั้ง คนละวัน คนละช่วงเวลา</div>${cs2.length ? `<table><tr><th>ชื่อ</th><th>โค้ช</th><th>ไม่ตอบมา</th><th>ประวัติการติดต่อ</th><th>สถานะ</th><th></th></tr>${r2}</table>` : '<div class="empty">ไม่มีรายชื่อ</div>'}</div>

/* ============ view: report ============ */
function teamStats(t, list) {
  const sts = list.map(m => statusOf(m, t)), cnt = k => sts.filter(s => s === k).length, act = cnt('up') + cnt('side') + cnt('down');
  return {cnt, act, idx: act ? Math.round(cnt('up') / act * 100) : 0};
}
function vReport() {
  const t = now(), all = visible(), prev = addDays(t, -7);
  const s = teamStats(t, all), sp = teamStats(prev, M.filter(m => m.join <= prev));
  const delta = s.idx - sp.idx;
  const newM = all.filter(m => m.join > prev);
  const due = newM.filter(m => (m.contact && m.contact <= t) || hrs(m.join, t) >= 24);
  const ok = due.filter(m => m.contact && m.contact <= t && hrs(m.join, m.contact) <= 24);
  const pct = due.length ? Math.round(ok.length / due.length * 100) : 100;
  const pipe = [1, 2, 3, 4].map(ep => all.filter(m => ['up','side','down'].includes(statusOf(m, t)) && lessonAt(m, t) && lessonAt(m, t).ep === ep).length);
  const notStarted = all.filter(m => ['up','down'].includes(statusOf(m, t)) && !lessonAt(m, t)).length;
  const alerts = all.flatMap(m => alertsOf(m, t));
  const hwOpen = alerts.filter(a => a.k === 'hw' || a.k === 'ftHw');
  const ft = all.filter(m => m.ft && m.ft.since <= t);
  const coachRows = COACHES.map(c => { const l = all.filter(m => m.coach === c), cs = teamStats(t, l), al = l.flatMap(m => alertsOf(m, t)); return `<tr><td>โค้ช${c}</td><td>${cs.act}</td><td>${cs.idx}%</td><td>${al.filter(a => a.pri === 0).length}</td><td>${al.filter(a => a.k === 'hw' || a.k === 'ftHw').length}</td></tr>`; }).join('');
  const text = [`Basic Market Report · ${fdy(t)}`, `Basic Index ${s.idx}% (${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)} จุด)`, `สมช ใหม่ ${newM.length} คน · ทักภายใน 24 ชม. ${pct}%`, `EP.1 ${pipe[0]} · EP.2 ${pipe[1]} · EP.3 ${pipe[2]} · EP.4 ${pipe[3]} · จบ/ไป Advance ${s.cnt('tp')}`, `Downtrend ${s.cnt('down')} · Sideway ${s.cnt('side')} · พัก ${s.cnt('sp')} · Stop loss ${s.cnt('stop')}`, `Fast Track ${ft.filter(m => m.ft.status !== 'adv').length} คน · การบ้านรอตรวจ ${hwOpen.length}`].join('\n');
  const copy = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('คัดลอกสรุปแล้ว วางใน LINE ได้เลย'); } catch (e) { toast('คัดลอกไม่สำเร็จ'); } ta.remove(); };
  const tile = (lb, vl, note = '') => `<div class="card kpi"><div class="lb">${lb}</div><div class="vl">${vl}</div>${note ? `<div class="note">${note}</div>` : ''}</div>`;
  return `<div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1"><h1>Basic Market Report</h1><p class="sub">สัปดาห์ ${fd(addDays(t, -6))} – ${fdy(t)} · ระบบสร้างให้อัตโนมัติทุกวันศุกร์</p></div>${B('คัดลอกสรุปส่ง LINE', copy, 'pri')}</div>
    <div class="grid" style="grid-template-columns:1.1fr 2.4fr;margin-bottom:14px">
      <div class="card kpi" style="display:flex;flex-direction:column;justify-content:center"><div class="lb">Basic Index · % สมช ที่เป็น Uptrend</div><div class="vl" style="font-size:52px">${s.idx}%</div><div class="dl" style="color:${delta >= 0 ? '#006300' : '#8f1f1f'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)} จุด จากสัปดาห์ก่อน</div><div class="note">จาก ${s.act} คนที่กำลังเรียน</div></div>
      <div class="grid">
        <div class="grid" style="grid-template-columns:repeat(4,1fr)">${tile('สมช ใหม่ (7 วัน)', newM.length)}${tile('ทักภายใน 24 ชม.', pct + '%', `${ok.length}/${due.length} คนที่ครบกำหนด`)}${tile('ส่ง CS-1', s.cnt('cs'))}${tile('การบ้านรอตรวจ', hwOpen.length, `เกิน 48 ชม. ${hwOpen.filter(a => a.pri === 0).length}`)}</div>
        <div class="card"><div class="note" style="margin-bottom:6px">จำนวน สมช แยกตามบทเรียน</div><div class="stage">
          <div class="stg"><div class="n">${notStarted}</div><div class="t">ยังไม่เริ่ม</div></div><span class="a">▶</span>
          ${pipe.map((n, i) => `<div class="stg"><div class="n">${n}</div><div class="t">EP.${i + 1}</div></div><span class="a">▶</span>`).join('')}
          <div class="stg" style="background:#fbf3d9;border-color:#e9d38a"><div class="n">${s.cnt('tp')}</div><div class="t">จบ / Advance</div></div></div></div>

    </div>

      <div class="card"><h3>แจ้งเตือน</h3><div style="line-height:2">${['down','side','sp','stop'].map(k => `${chip(k)} ${s.cnt(k)} คน`).join('<br>')}</div></div>
      <div class="card"><h3>Fast Track</h3><div style="line-height:2">รอนัด / นัดแล้ว: ${ft.filter(m => ['invited','scheduled'].includes(m.ft.status)).length}<br>การบ้าน / รอตรวจ: ${ft.filter(m => ['hw','clip'].includes(m.ft.status)).length}<br>ไป Advance แล้ว: ${ft.filter(m => m.ft.status === 'adv').length}</div></div>
      <div class="card"><h3>รายโค้ช</h3><table><tr><th>โค้ช</th><th>กำลังเรียน</th><th>Index</th><th>งานด่วน</th><th>การบ้าน</th></tr>${coachRows}</table></div>
    </div>
    <div class="card"><h3>Voice of Members <span class="muted" style="font-weight:400;font-size:12.5px">· ตัวอย่างคอมเม้นท์ สมช</span></h3>${VOICE.map(v => `<div class="voice"><span class="tag">${v.tag}</span> "${v.text}"<div class="note">ทีมทำแล้ว: ${v.act}</div></div>`).join('')}</div>`;
}

/* ============ view: member side ============ */
function chatHTML(m, t) {
  const msgs = [];
  if (m.contact && m.contact <= t) msgs.push({at:m.contact, html:`<div class="bub">${TPL.welcome(m, m.contact).replace('<span class="lbtn">เริ่ม Trader Type Quiz</span>', `<button class="lbtn" data-a="${A(() => { S.quiz = {id:m.id, step:0, ans:[null, null, null, null], err:''}; render(); })}">เริ่ม Trader Type Quiz</button>`)}</div>`});
  if (m.tags && m.reply && m.reply <= t) { const ty = typeOf(m); msgs.push({at:m.reply, html:`<div class="bub me">ทำควิซแล้ว ขอบคุณมากเลย</div>`}); msgs.push({at:new Date(m.reply.getTime() + 60e3), html:`<div class="lcard"><div class="hd" style="background:${ty.c}"><div style="font-size:11.5px;opacity:.85">สไตล์นักเทรดของคุณ</div><div style="font-size:17px;font-weight:700">${ty.name}</div><div style="font-size:12px">${ty.en}</div></div><div class="bd">${ty.tip}</div></div>`}); }
  else if (m.reply && m.reply <= t) msgs.push({at:m.reply, html:`<div class="bub me">สวัสดี ขอบคุณมากเลย</div>`});
  const lf = m.follows.filter(f => f <= t).pop(); if (lf) msgs.push({at:lf, html:`<div class="bub">${TPL.follow(m, lf)}</div>`});

  const W = visible().filter(m => advStage(m, t) === 'wait').sort((a, b) => advDue(a, t) - advDue(b, t));
  return `<div class="card" style="margin-top:14px"><h3>CS-3 · จบ Basic → คุยเรื่องโค้ช Advance</h3><div class="note" style="margin:-4px 0 8px">ระบบส่งรายชื่อให้อัตโนมัติเมื่อ สมช จบ Basic หรือผ่าน Fast Track · CS ติดต่อภายใน 1 วันทำการ แล้วทีมตั้งโค้ชประจำตัวให้ในระบบ</div>
    ${W.length ? `<table><tr><th>ชื่อ</th><th>โค้ช Basic</th><th>จบเมื่อ</th><th>กำหนดติดต่อ</th><th></th></tr>${W.map(m => `<tr><td><span class="nm" data-go="profile:${m.id}">คุณ${esc(m.name)}</span></td><td>${m.coach}</td><td>${fd(tpAt(m))} ${ftm(tpAt(m))}</td><td>${sla(advDue(m, t), t, 'ติดต่อ')}</td><td>${B('เปิดหน้าตั้งโค้ช', () => go('adv', m.id), 'pri')}</td></tr>`).join('')}</table>` : '<div class="empty">ไม่มีรายชื่อรอติดต่อ</div>'}</div>`;
}
function advProfileBox(m, t) {
  const st = advStage(m, t); if (!st) return '';
  const txt = st === 'wait' ? `รอ CS ติดต่อเรื่องโค้ช<br>${sla(advDue(m, t), t, 'ติดต่อ')}` : st === 'talked' ? `เลือกโค้ช${advC(m.adv.pick).name} · รอทีมตั้งในระบบ` : coachNames(m, t).map((n, i) => `${n} ${i ? '(เพิ่มผ่านเซล)' : '(โค้ชประจำตัว)'}`).join('<br>');
  return `<div class="card"><h3>Advance · โค้ช</h3><div class="note" style="font-size:13.5px">${txt}</div><div style="margin-top:8px">${B('เปิดหน้าตั้งโค้ช', () => go('adv', m.id))}</div></div>`;
}
function advChat(m, t) {
  const a = m.adv, out = [], line = a.calls.find(c => c.ch === 'LINE' && c.at <= t);
  if (line) out.push({at:line.at, html:`<div class="bub">${TPL.advCall(m)}</div>`});
  if (a.talkAt && a.talkAt <= t && !(a.setAt && a.setAt <= t)) out.push({at:a.talkAt, html:`<div class="bub">ขอบคุณที่คุยกับ CS นะ สรุป: คุณ${m.nick}เลือกโค้ช${advC(a.pick).name} ทีมกำลังตั้งให้ในระบบ พร้อมแล้วจะแจ้งอีกครั้ง</div>`});
  if (a.setAt && a.setAt <= t) { const c = advC(a.coach); out.push({at:a.setAt, html:`<div class="lcard"><div class="hd" style="background:#14213d"><div style="font-size:11.5px;opacity:.85">SPTR Advance</div><div style="font-size:17px;font-weight:700">โค้ชประจำตัว: โค้ช${c.name}</div></div><div class="bd">${TPL.advSet(m, c)}</div></div>`}); }
  a.extra.filter(x => x.at <= t).forEach(x => out.push({at:x.at, html:`<div class="bub">${TPL.advAdd(m, advC(x.id))}</div>`}));
  return out;
}
function advWeb(m, t) {
  const st = advStage(m, t);
  if (st === 'set') return `โค้ชของคุณ: <b>${coachNames(m, t).join(' + ')}</b> · เข้าเรียนบนเว็บ Advance ได้แล้ว`;
  if (st === 'talked') return `คุณเลือกโค้ช${advC(m.adv.pick).name}แล้ว · ทีมกำลังตั้งให้ในระบบ`;
  return 'ขั้นต่อไป: ทีม CS จะติดต่อภายใน 1 วันทำการ เพื่อช่วยเลือกโค้ชประจำตัวใน Advance';
}

/* ============ render ============ */
function render() {
  ACT = {}; seq = 0;
  renderSide(); renderTop();
  const v = {today:vToday, screener:vScreener, profile:vProfile, ft:vFT, cs:vCS, report:vReport, member:vMember, adv:vAdv}[S.view];
  $('#view').innerHTML = v();
  const lc = $('#lchat'); if (lc) lc.scrollTop = lc.scrollHeight;
}
// ลิงก์ตรงไปหน้าที่ต้องการ เช่น #v=profile&id=m07&d=19 (d = จำนวนวันจาก 23 ก.ย.)
(() => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('d')) S.now = at(+h.get('d'), 18);
  if (h.get('coach')) S.coach = h.get('coach');
  if (h.get('mode')) S.smode = h.get('mode');
  const v = h.get('v'), id = h.get('id');
  if (v) { S.view = v; if (id) { if (v === 'profile') S.sel = id; if (v === 'member') S.mv = id; if (v === 'ft') S.ftSel = id; if (v === 'adv') S.advSel = id; } }
  if (h.get('quiz') != null) { const ans = (h.get('ans') || '').split(',').map(x => x === '' || x === '-' ? null : +x); while (ans.length < 4) ans.push(null); S.quiz = {id:S.mv, step:+h.get('quiz'), ans, err:''}; }
  if (h.get('pre')) S.form = {id:S.ftSel, t:[1,1,1], sr:2, plan:[1,1,1,0], stock:'AOT', memo:'อ่านเทรนด์ครบ 3 ภาพ แผนเทรดยังไม่คำนวณขนาดไม้', err:'', touched:true};
})();
render();
</script>
