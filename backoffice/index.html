<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SPTR หลังบ้าน — Member System (Mockup)</title>
<style>
/* same colours as the member site's Advance theme (navy · royal blue · gold) */
:root{--artbg:#0d1a3a;--bg:#0b1222;--bg2:#111a2e;--bg3:#17223a;--bg4:#1f2b46;--line:rgba(160,185,255,.09);--line2:rgba(160,185,255,.18);--ink:#eef2fa;--ink2:#b7c0d4;--mut:#9aa6bd;--gold:#e3b857;--gold2:#f3d98f;--goldbg:rgba(227,184,87,.13);--goldln:rgba(227,184,87,.45);--green:#56d68a;--greenbg:rgba(86,214,138,.12);--purple:#b69cff;--purplebg:rgba(182,156,255,.13);--blue:#7aa2ff;--bluebg:rgba(122,162,255,.14);--rose:#ff7a90;--rosebg:rgba(255,122,144,.12);--shadow:0 18px 44px rgba(0,0,0,.5);--btn:linear-gradient(135deg,#f6d983,#d9a63f)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Leelawadee UI","Leelawadee","Thonburi","Sukhumvit Set","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);background:radial-gradient(1100px 560px at 88% -8%,rgba(36,89,224,.18),transparent 62%) no-repeat,var(--bg);font-size:14.5px;line-height:1.55;min-width:1180px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13.5px;cursor:pointer;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);padding:6px 14px;line-height:1.35;font-weight:600}
button:hover{border-color:var(--goldln);background:rgba(255,255,255,.09)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.pri{background:var(--btn);border-color:transparent;color:#221a0b;font-weight:700}
button.pri:hover{filter:brightness(1.06);background:var(--btn)}
button.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
button.ghost:hover{color:var(--gold2);background:rgba(255,255,255,.05)}
button.jump,.abtn{font-size:12.5px;padding:4px 11px;background:var(--bg3);border:1px solid var(--line2);border-radius:999px;color:var(--ink2);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.abtn{color:var(--gold2)}
.abtn:hover{border-color:var(--goldln)}
input[type=text],textarea,select{font-family:inherit;font-size:14px;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;color:var(--ink);background:var(--bg3)}
select option{background:var(--bg2);color:var(--ink)}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--goldln);outline:none}
input[type=checkbox],input[type=radio]{accent-color:var(--gold)}
textarea{width:100%;resize:vertical;min-height:64px}
::placeholder{color:var(--mut)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
#side{background:rgba(8,13,26,.82);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.logo{padding:0 8px 10px}
.logo i{display:block;width:150px;height:62px;background:var(--logo) left center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.logo small{display:block;font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:700;margin-top:6px}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--ink2);padding:9px 12px;border-radius:12px;font-size:14.5px;font-weight:500}
.nav:hover{background:var(--bg3);color:var(--ink);border-color:transparent}
.nav.on{background:var(--goldbg);color:var(--gold2);font-weight:700;border-color:rgba(227,184,87,.25)}
.nav .cnt{font-size:11.5px;background:var(--gold);color:#1a1408;border-radius:999px;padding:1px 8px;font-weight:700}
.sec{font-size:11px;letter-spacing:.14em;color:var(--mut);margin:16px 12px 4px;font-weight:700}
#side select{width:100%}
.lkbox{margin-top:auto;padding:12px;border:1px solid rgba(86,214,138,.22);border-radius:14px;background:rgba(86,214,138,.05);display:flex;flex-direction:column;gap:6px}
.lkact{display:flex;gap:6px;flex-wrap:wrap}
.sfoot{font-size:11.5px;color:var(--mut);line-height:1.6;padding:10px 8px 0}
main{min-width:0;position:relative}
#top{position:sticky;top:0;z-index:5;background:rgba(11,18,34,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(227,184,87,.14);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.simlbl{font-size:12px;color:var(--mut)}
.simdate{font-weight:700;font-size:15.5px;color:var(--gold2);margin-right:6px}
.mockflag{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flag{font-size:12px;font-weight:700;color:var(--gold);background:var(--goldbg);border:1px solid var(--goldln);border-radius:999px;padding:3px 11px}
.linkdot{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--green);font-weight:700;cursor:help}
.linkdot i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--greenbg)}
#view{padding:24px 26px 56px}
h1{font-size:26px;margin:0 0 2px;color:var(--ink);letter-spacing:-.01em;line-height:1.35}
.sub{color:var(--ink2);margin:0 0 16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:16px;color:var(--ink)}
.grid{display:grid;gap:14px}
.muted{color:var(--mut)}
.note{font-size:12.5px;color:var(--ink2);line-height:1.55}
.kpi .lb{font-size:12.5px;color:var(--ink2)}
.kpi .vl{font-size:28px;font-weight:700;color:var(--gold2);line-height:1.25}
.kpi .dl{font-size:12.5px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--bg3);white-space:nowrap;color:var(--ink);vertical-align:1px}
.chip i,.dotl{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--bg4);color:var(--ink2);margin:0 4px 4px 0}
.tag.ft{background:var(--purplebg);color:var(--purple);font-weight:700}
.tag.web{background:var(--bluebg);color:var(--blue);font-weight:700}
.grp{font-size:14px;font-weight:700;margin:2px 0 4px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.grp .n{font-weight:400;color:var(--mut)}
.task{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.nm{font-weight:700;color:var(--ink);cursor:pointer}
.nm:hover{color:var(--gold2);text-decoration:underline}
.task .tt{font-size:14px;margin-top:2px}
.task .ss{font-size:12.5px;color:var(--ink2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.banner{border-radius:14px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;margin-bottom:10px;border:1px solid}
.banner.cls{background:var(--bluebg);border-color:rgba(122,162,255,.3);color:#d3e0ff}
.banner.rep{background:var(--greenbg);border-color:rgba(86,214,138,.3);color:#cdf5dd}
.banner.cb{background:var(--goldbg);border-color:var(--goldln);color:var(--gold2)}
.banner .sp{margin-left:auto}
.hint{background:var(--purplebg);border:1px solid rgba(182,156,255,.28);border-radius:18px;padding:14px 16px;color:var(--ink)}
.hint b{color:#dccfff}
.hint ul{margin:6px 0 0;padding-left:18px}
.hint li{margin-bottom:6px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.empty{color:var(--mut);font-size:13.5px;padding:8px 0}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fchip{font-size:12.5px;padding:4px 12px;color:var(--ink2);background:transparent}
.fchip.on{background:var(--goldbg);color:var(--gold);border-color:var(--goldln)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px}
.tile{border-radius:12px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,var(--bg2));color:var(--ink);cursor:pointer;min-height:70px}
.tile:hover{border-color:var(--c)}
.tile b{display:block;font-size:14px}
.tile span{display:block;font-size:12px;line-height:1.45;color:var(--ink2)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:700;background:var(--bg3)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.03)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border-radius:12px;padding:8px 10px;font-size:12.5px;border:1px solid var(--line);background:var(--bg3);color:var(--mut)}
.step b{display:block;font-size:13.5px;color:var(--ink)}
.step.done{background:var(--greenbg);border-color:rgba(86,214,138,.3);color:var(--green)}
.step.cur{background:var(--goldbg);border-color:var(--gold);color:var(--gold2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tl li:last-child{border-bottom:none}
.tl .d{color:var(--mut)}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kcol{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:18px;padding:10px;min-height:150px}
.kcol h4{margin:2px 4px 8px;font-size:13.5px;color:var(--ink);display:flex;justify-content:space-between}
.kcard{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:9px 11px;margin-bottom:8px;cursor:pointer;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.kcard:hover{border-color:var(--goldln)}
.kcard.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldbg)}
.kcard b{font-size:13.5px;color:var(--ink)}
.ck{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px;cursor:pointer}
.ck input{width:16px;height:16px}
.fsec{border-top:1px solid var(--line);padding:10px 0}
.fsec h4{margin:0 0 4px;font-size:14px;color:var(--ink);display:flex;justify-content:space-between}
.res{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
.res.ok{background:var(--greenbg);color:#cdf5dd;border:1px solid rgba(86,214,138,.3)}
.res.no{background:var(--rosebg);color:#ffd3db;border:1px solid rgba(255,122,144,.3)}
.res.wait{background:var(--bg3);color:var(--ink2);border:1px solid var(--line2)}
.res b{color:var(--ink)}
.err{color:var(--rose);font-size:13px;margin-top:4px}
.stage{display:flex;align-items:center;gap:6px}
.stg{flex:1;text-align:center;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:6px 4px}
.stg .n{font-size:21px;font-weight:700;color:var(--ink)}
.stg .t{font-size:12px;color:var(--ink2)}
.stage .a{color:var(--mut);font-size:12px}
.voice{border-bottom:1px solid var(--line);padding:9px 0;font-size:13.5px}
.voice:last-child{border-bottom:none}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#e7c784,#9c7426);background-size:cover;background-position:center 18%;color:#1a1408;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle;border:1.5px solid var(--goldln)}
/* Advance coach desk */
.sla{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-top:4px;border:1px solid}
.sla.ok{background:var(--bg3);border-color:var(--line2);color:var(--ink2)}
.sla.due{background:var(--goldbg);border-color:var(--goldln);color:var(--gold2)}
.sla.late{background:var(--rosebg);border-color:rgba(255,122,144,.4);color:var(--rose)}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .why{font-size:12.5px;color:var(--ink2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);margin:-6px 0 14px}
.flow b{background:var(--bg3);border:1px solid var(--line2);border-radius:999px;padding:3px 11px;color:var(--ink);font-weight:700}
/* member view: LINE phone + member website */
.mvw{display:flex;gap:22px;align-items:flex-start}
.phone{width:352px;height:690px;border-radius:40px;background:#05080f;border:1px solid var(--line2);padding:12px;flex:none;box-shadow:var(--shadow)}
.pscreen{background:#fff;border-radius:30px;height:100%;overflow:hidden;display:flex;flex-direction:column}
.phead{background:#111a2e;color:#fff;padding:16px 16px 10px;font-weight:700;font-size:14.5px}
.phead small{display:block;font-weight:400;font-size:11.5px;color:#b7c0d4}
.lchat{background:#8fb0dc;flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.lchat>*{flex-shrink:0}
.bub{max-width:84%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.55;background:#fff;color:#111;align-self:flex-start}
.bub.me{background:#c8f5b0;align-self:flex-end}
.lday{align-self:center;font-size:11px;background:rgba(0,0,0,.2);color:#fff;border-radius:999px;padding:2px 10px}
.lbtn{display:block;margin:8px 0 4px;text-align:center;background:#06c755;color:#fff;border-radius:8px;padding:7px;font-weight:700;border:none;width:100%;font-size:13px}
.lbtn:hover{background:#05b34c}
.lcard{align-self:flex-start;width:84%;background:#fff;color:#111;border-radius:16px;overflow:hidden;font-size:13px}
.lcard .hd{padding:12px 14px;color:#fff}
.lcard .bd{padding:10px 14px;line-height:1.55}
.pinput{background:#fff;border-top:1px solid #e6e9ef;padding:11px 14px;font-size:12.5px;color:#8b95a8}
.qz{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;color:#111}
.qz button{color:#111;background:#fff;border-color:#cfd6e0;border-radius:10px;font-weight:400}
.qz button.pri{background:#14213d;color:#fff;border-color:#14213d}
.qopt{text-align:left;padding:10px 12px;font-size:13.5px}
.qz .qopt.on{border-color:#06c755;background:#e9faf0;color:#05652d;font-weight:700}
.qz .lbtn{background:#06c755;color:#fff;border:none}
.qbar{height:5px;background:#eef1f5;border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:#06c755}
.web{flex:1;min-width:0;border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:var(--bg2)}
.wbar{background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.wbar .u{background:var(--bg);border-radius:8px;padding:3px 10px;flex:1;color:var(--mut)}
.wbar a{color:var(--gold2);text-decoration:none;font-weight:700}
.wbody{padding:18px 20px}
#dockslot{flex:1;min-width:0;height:690px}
#dock{position:absolute;z-index:1;display:none;flex-direction:column;border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
#dock.on{display:flex}
#dock iframe{flex:1;border:0;width:100%;background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50}
.modal.hidden{display:none}
.mbox{background:var(--bg2);border:1px solid var(--line2);border-radius:22px;width:520px;max-width:92vw;max-height:90vh;overflow-y:auto;padding:20px 22px;box-shadow:var(--shadow)}
.mhead{font-weight:700;font-size:17px;color:var(--ink);margin-bottom:10px}
.mchat{background:#8fb0dc;border-radius:14px;padding:12px;margin-bottom:8px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg4);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--shadow);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:80vw}
#toast.show{opacity:1}
#tip{position:fixed;display:none;background:var(--bg4);color:var(--ink);border:1px solid var(--line2);font-size:12.5px;padding:5px 9px;border-radius:8px;pointer-events:none;z-index:70;max-width:320px}
/* ===== member-site components ===== */
.ic{flex:none;display:inline-block;vertical-align:middle}
button .ic{margin-right:2px;vertical-align:-3px}
.ph{display:flex;align-items:flex-end;gap:16px;margin:0 0 18px}
.ph h1{font-size:30px;margin:0;letter-spacing:-.015em}
.ph p{color:var(--ink2);margin:4px 0 0}
.ph .pa{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hk{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--mut);margin-bottom:6px}
.nS{font-family:Georgia,"Times New Roman",serif;font-weight:700;color:var(--gold);letter-spacing:.1em;font-size:14px;padding-right:10px;border-right:1px solid rgba(255,255,255,.3);line-height:1}
.ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ico.sm{width:30px;height:30px;border-radius:10px}
.i-g{background:var(--goldbg);color:var(--gold)}.i-gr{background:var(--greenbg);color:var(--green)}.i-pu{background:var(--purplebg);color:var(--purple)}.i-bl{background:var(--bluebg);color:var(--blue)}.i-ro{background:var(--rosebg);color:var(--rose)}.i-mu{background:var(--bg4);color:var(--ink2)}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sh h3{margin:0;font-size:16px}
.sh .n{color:var(--mut);font-size:12.5px}
.sh .more{margin-left:auto;display:flex;gap:6px}
.mav{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#0b1222;flex:none;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 80%,#fff),color-mix(in srgb,var(--c) 78%,#000));box-shadow:0 0 0 2px var(--bg2),0 0 0 3.5px color-mix(in srgb,var(--c) 55%,transparent);vertical-align:middle;line-height:1}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .wn{min-width:0}
.who .wn b{display:block;font-size:14.5px;color:var(--ink);line-height:1.35}
.who .wn span{display:block;font-size:12.5px;color:var(--mut)}
.hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid rgba(227,184,87,.22);background:var(--artbg);margin-bottom:16px;isolation:isolate}
.hero>svg.th{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(9,15,31,.96) 0%,rgba(9,15,31,.78) 42%,rgba(9,15,31,.12) 100%)}
.hin{padding:26px 30px 24px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.hin .ht{flex:1;min-width:340px}
.hero .hk{color:rgba(223,230,245,.82)}
.hero h1{font-size:34px;margin:4px 0 4px;letter-spacing:-.015em}
.hero p{margin:0;color:var(--ink2)}
.hchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:rgba(11,18,34,.72);border:1px solid var(--line2);color:var(--ink)}
.hchip .ic{color:var(--gold)}
.hstats{display:flex;gap:10px;flex-wrap:wrap}
.hs{background:rgba(11,18,34,.74);border:1px solid var(--line2);border-radius:18px;padding:12px 16px;min-width:128px;backdrop-filter:blur(6px);cursor:pointer}
.hs:hover{border-color:var(--goldln)}
.hs b{display:block;font-size:28px;color:var(--gold2);line-height:1.2}
.hs span{font-size:12.5px;color:var(--ink2)}
.hs.alert b{color:var(--rose)}

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  for (let i = 1; i < 4; i++) s += `<line x1="0" x2="${W}" y1="${H * i / 4}" y2="${H * i / 4}" stroke="rgba(255,255,255,.05)"/>`;
  let p = .3 + r() * .2; const trend = o.trend ?? .012, step = W / (n + 1), pts = [];
  for (let i = 0; i < n; i++) {
    const op = p, cl = Math.min(.9, Math.max(.1, p + (r() - .46) * .09 + trend)), hi = Math.max(op, cl) + r() * .035, lo = Math.min(op, cl) - r() * .035;

  }

}

function spark(vals, color = '#e3b857', w = 110, h = 40) {
  const mx = Math.max(...vals), mn = Math.min(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [(i / (vals.length - 1) * (w - 6) + 3).toFixed(1), (h - 5 - (v - mn) / rg * (h - 10)).toFixed(1)]);
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3.2" fill="${color}"/></svg>`;
}
function donut(parts, center, label, size = 124) {
  const tot = parts.reduce((a, p) => a + p.v, 0) || 1, R = 46, C = 2 * Math.PI * R; let off = 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="${esc(label)} ${center}"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#1f2b46" stroke-width="14"/>${parts.map(p => { const len = p.v / tot * C; const x = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p.c}" stroke-width="14" stroke-dasharray="${Math.max(0, len - 1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += len; return x; }).join('')}<text x="60" y="60" text-anchor="middle" font-size="24" font-weight="700" fill="#eef2fa">${center}</text><text x="60" y="78" text-anchor="middle" font-size="11" fill="#9aa6bd">${esc(label)}</text></svg>`;
}
function ring(v, label, size = 150) {
  const R = 58, C = 2 * Math.PI * R, id = 'rg' + (++gid);
  return `<svg width="${size}" height="${size}" viewBox="0 0 150 150" role="img" aria-label="${esc(label)} ${v}%"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d983"/><stop offset="1" stop-color="#d9a63f"/></linearGradient></defs><circle cx="75" cy="75" r="${R}" fill="none" stroke="#1f2b46" stroke-width="13"/><circle cx="75" cy="75" r="${R}" fill="none" class="ringa" stroke="url(#${id})" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C * v / 100} ${C}" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#f3d98f">${v}%</text><text x="75" y="101" text-anchor="middle" font-size="11.5" fill="#9aa6bd">${esc(label)}</text></svg>`;
}
const chip = st => st ? `<span class="chip"><i style="background:${ST[st].c}"></i>${ST[st].name}</span>` : '';
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; }
function done(msg) { closeModal(); render(); if (msg) toast(msg); }
function go(v, id) { S.view = v; S.bell = false; if (v === 'csg' && id) S.sgSel = id; if (v === 'hw' && id) { S.hwFocus = id; S.hwTab = 'wait'; } if (v === 'sched' && id) S.evSel = id; if (v === 'profile' && id) S.sel = id; if (v === 'member' && id) { S.mv = id; S.quiz = null; } if (v === 'ft' && id) { S.ftSel = id; S.form = null; } if (v === 'adv' && id) { S.advSel = id; S.advForm = null; } render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (a && ACT[a.dataset.a]) { e.preventDefault(); ACT[a.dataset.a](e); return; }
  const g = e.target.closest('[data-go]'); if (g) { const [v, id] = g.dataset.go.split(':'); go(v, id); return; }
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('change', e => { const c = e.target.closest('[data-ch]'); if (c && ACT[c.dataset.ch]) ACT[c.dataset.ch](e); });
document.addEventListener('input', e => { const c = e.target.closest('[data-in]'); if (c && ACT[c.dataset.in]) ACT[c.dataset.in](e); });
document.addEventListener('keydown', e => {
  if (e.target.id === 'q' && e.key === 'Enter') { const b = $('#sres .it'); if (b) b.click(); }
  if (e.key === 'Escape') { const r = $('#sres'); if (r) r.hidden = true; if (S.bell) { S.bell = false; S.seenAt = now(); renderTop(); } if (!$('#modal').classList.contains('hidden')) closeModal(); }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.srch')) { const r = $('#sres'); if (r) r.hidden = true; }
  if (S.bell && !e.target.closest('.bellw') && e.target.isConnected) { S.bell = false; S.seenAt = now(); renderTop(); }
});
const tipEl = $('#tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (!t) return; tipEl.textContent = t.dataset.tip; tipEl.style.display = 'block'; });
document.addEventListener('mousemove', e => { if (tipEl.style.display === 'block') { tipEl.style.left = (e.clientX + 12) + 'px'; tipEl.style.top = (e.clientY + 12) + 'px'; } });

    case 'ipo': return B('ส่งข้อความต้อนรับ', () => lineModal(m, 'welcome', () => { m.contact = now(); log(m, 'ทักครั้งแรกทาง LINE'); }), 'pri');

    case 'cs1': return B('ส่งให้ CS', () => { m.cs1At = now(); log(m, 'ส่งต่อ CS-1 (ไม่ตอบ 24 ชม.)'); done('ส่งรายชื่อให้ CS แล้ว'); }, 'pri');
    case 'cs2': return B('ส่งให้ CS พร้อมประวัติ', () => { m.cs2At = now(); log(m, 'ส่งต่อ CS-2 (No Active)'); done('ส่งเป็น No Active ให้ CS แล้ว'); }, 'pri');

    case 'down': return m.tags && m.tags.level >= 2
      ? B('ชวน Fast Track', () => lineModal(m, 'ftInvite', () => { m.ft = {gate:'A', status:'invited', since:now()}; log(m, 'ชวนเข้า Fast Track (ประตู A)'); }), 'pri')

    case 'm3': return B('เสนอ 2 ทาง', () => lineModal(m, 'm3', null, [

      {label:'สมช เลือกพักการเรียน', fn:() => { m.offer3At = now(); const c = lessonAt(m, now()); m.pause = {start:now(), ep:c ? c.ep : 1, reason:'เลือกพักหลังครบ 3 เดือน', expect:'—', ret:null, comeback:null}; log(m, 'เลือกพักการเรียน'); }, toast:'บันทึกพักการเรียนแล้ว'},
      {label:'สมช เลือก Fast Track', cls:'pri', fn:() => { m.offer3At = now(); m.ft = {gate:'B', status:'invited', since:now()}; log(m, 'เลือก Fast Track (ประตู B)'); }, toast:'ย้ายเข้า Fast Track แล้ว'},
    ]), 'pri');
    case 'follow': return B('ส่ง LINE', () => lineModal(m, 'follow', () => { m.follows.push(now()); log(m, 'Follow ทาง LINE'); })) + B('โทรแล้ว', () => { m.follows.push(now()); log(m, 'โทร Follow'); done('บันทึก Follow แล้ว'); });
    case 'hw': return B('ตรวจแล้ว: ผ่าน', () => { a.hw.rev = now(); a.hw.pass = true; a.hw.note = ''; done('บันทึกผลตรวจแล้ว · แจ้ง สมช แล้ว'); }, 'pri') + B('ส่งกลับให้แก้', () => hwFixModal(m, a.hw));
    case 'comeback': return B('ส่ง Comeback pack', () => lineModal(m, 'comeback', () => { m.pause.comeback = now(); log(m, 'ส่ง Comeback pack'); }), 'pri') + B('กลับมาเรียนแล้ว', () => { m.pause.ret = now(); log(m, 'กลับมาเรียน (เริ่มนับรอบใหม่)'); done(`คุณ${m.nick}กลับมาเรียนแล้ว`); });
    case 'ftInvite': return B('นัด Screening พรุ่งนี้', () => { const d = addDays(dOnly(now()), 1); d.setHours(14); m.ft.status = 'scheduled'; m.ft.screenAt = d; m.ft.channel = m.tags && m.tags.bkk ? 'onsite' : 'online'; log(m, `นัด Screening ${fd(d)} 14:00`); done('นัด Screening แล้ว'); });
    case 'ftScreen': return B('เปิดฟอร์ม Screening', () => go('ft', m.id), 'pri');

}

function teamStats(t, list) {
  const sts = list.map(m => statusOf(m, t)), cnt = k => sts.filter(s => s === k).length, act = cnt('up') + cnt('side') + cnt('down');
  return {cnt, act, idx: act ? Math.round(cnt('up') / act * 100) : 0};
}
function trendChart(hist) {
  const W = 560, H = 190, L = 34, R = 14, T = 16, Bm = 28, n = hist.length, id = 'tr' + (++gid);
  const X = i => L + (W - L - R) * i / (n - 1), Y = v => T + (H - T - Bm) * (1 - v / 100);
  const pts = hist.map((h, i) => `${X(i).toFixed(1)},${Y(h.v).toFixed(1)}`);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Basic Index ย้อนหลัง ${n} สัปดาห์"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b857" stop-opacity=".35"/><stop offset="1" stop-color="#e3b857" stop-opacity="0"/></linearGradient></defs>`;
  [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f2b46"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="#9aa6bd">${v}</text>`; });
  s += `<polygon points="${X(0)},${Y(0)} ${pts.join(' ')} ${X(n - 1)},${Y(0)}" fill="url(#${id})"/><polyline class="trendl" points="${pts.join(' ')}" fill="none" stroke="#e3b857" stroke-width="2.4" stroke-linejoin="round"/>`;
  hist.forEach((h, i) => { s += `<circle cx="${X(i)}" cy="${Y(h.v)}" r="${i === n - 1 ? 5 : 3.5}" fill="${i === n - 1 ? '#f3d98f' : '#111a2e'}" stroke="#e3b857" stroke-width="2"/><text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="#9aa6bd">${fnum(h.d)}</text><circle cx="${X(i)}" cy="${Y(h.v)}" r="12" fill="transparent" data-tip="สัปดาห์ ${fd(h.d)} · Basic Index ${h.v}%"/>`; });
  return s + '</svg>';
}

function advProfileBox(m, t) {

}
function advChat(m, t) {
  const a = m.adv, out = [], line = a.calls.find(c => c.ch === 'LINE' && c.at <= t);
  if (line) out.push({at:line.at, html:`<div class="bub">${TPL.advCall(m)}</div>`});
  if (a.talkAt && a.talkAt <= t && !(a.setAt && a.setAt <= t)) out.push({at:a.talkAt, html:`<div class="bub">ขอบคุณที่คุยกับ CS นะ สรุป: คุณ${m.nick}เลือกโค้ช${advC(a.pick).name} ทีมกำลังตั้งให้ในระบบ พร้อมแล้วจะแจ้งอีกครั้ง</div>`});
  if (a.setAt && a.setAt <= t) { const c = advC(a.coach); out.push({at:a.setAt, html:`<div class="lcard"><div class="hd" style="background:#14213d"><div style="font-size:11.5px;opacity:.85">SPTR Advance</div><div style="font-size:17px;font-weight:700">โค้ชประจำตัว: โค้ช${c.name}</div></div><div class="bd">${TPL.advSet(m, c)}</div></div>`}); }
  a.extra.filter(x => x.at <= t).forEach(x => out.push({at:x.at, html:`<div class="bub">${TPL.advAdd(m, advC(x.id))}</div>`}));
  return out;
}
function advWeb(m, t) {
  const st = advStage(m, t);
  if (st === 'set') return `โค้ชของคุณ: <b>${coachNames(m, t).join(' + ')}</b> · เข้าเรียนบนเว็บ Advance ได้แล้ว`;
  if (st === 'talked') return `คุณเลือกโค้ช${advC(m.adv.pick).name}แล้ว · ทีมกำลังตั้งให้ในระบบ`;
  return 'ขั้นต่อไป: ทีม CS จะติดต่อภายใน 1 วันทำการ เพื่อช่วยเลือกโค้ชประจำตัวใน Advance';
}

  m.adv = {calls:(a.calls || []).map(c => ({ch:c.ch, at:dt(c.at)})), csReq:a.csReq ? {at:dt(a.csReq.at), coach:a.csReq.coach || null} : null, talkAt:dt(a.talkAt), pick:a.pick || null, ch:a.ch || 'โทร', memo:a.memo || '', talkBy:a.talkBy || ME_CS,
    setAt:dt(a.setAt), coach:a.coach || null, by:a.by || ME_CS, extra:(a.extra || []).map(x => ({id:x.id, at:dt(x.at), by:x.by || ME_CS}))};
  REQ = REQ.filter(r => r.m !== ME_ID).concat((L.reqs || []).map(r => ({...r, m:ME_ID, at:dt(r.at), paidAt:dt(r.paidAt), doneAt:dt(r.doneAt)})));
}
let linkLast = '';
function linkSave() { const cur = JSON.stringify(meSnap()); if (cur === linkLast) return; linkLast = cur; LINK.set({...JSON.parse(cur), from:'back', at:Date.now()}); }
function linkNews(a, b) {
  const nm = 'คุณมณีรัตน์', out = [];
  b.hw.filter(h => !a.hw.some(x => x.ep === h.ep && x.n === h.n && x.sub === h.sub)).forEach(h => out.push(`${nm}ส่งการบ้าน EP.${h.ep} ข้อ ${h.n}${a.hw.some(x => x.ep === h.ep && x.n === h.n) ? ' (ส่งใหม่หลังแก้)' : ''}`));
  if (!a.chall && b.chall) out.push(`${nm}ส่งคำตอบ Chart Challenge`);
  const ev = id => { const e = CALX.find(x => x.id === id); return e ? `${evName(e)} ${TH_DS[e.at.getDay()]} ${fd(e.at)}` : id; };
  Object.keys(b.bk || {}).filter(id => !(a.bk || {})[id]).forEach(id => out.push(`${nm}จอง ${ev(id)}${b.bk[id].slot ? ' ' + b.bk[id].slot + ' น.' : ''}`));
  Object.keys(a.bk || {}).filter(id => !(b.bk || {})[id]).forEach(id => out.push(`${nm}ยกเลิกการจอง ${ev(id)}`));
  if (!a.ft && b.ft) out.push(`${nm}ขอ Fast Track`);
  if (b.fb.length > a.fb.length) out.push(`${nm}ส่งความคิดเห็น ${'★'.repeat(b.fb[b.fb.length - 1].stars)}`);
  if (!a.grad && b.grad) out.push(`${nm}จบ Basic · เข้าคิวรอ CS ติดต่อ`);
  if (!a.adv.csReq && b.adv.csReq) out.push(`${nm}ขอให้ CS ติดต่อกลับ${b.adv.csReq.coach ? ' · สนใจโค้ช' + cn(b.adv.csReq.coach) : ''}`);
  b.reqs.filter(r => !a.reqs.some(x => x.id === r.id)).forEach(r => out.push(`${nm}ขอเพิ่มโค้ช${cn(r.coach)} · รอเซลติดต่อ`));
  (b.qa || []).filter(q => !(a.qa || []).some(x => x.id === q.id)).forEach(q => out.push(`${nm}ถามใต้คลิป "${q.clip}"`));
  if (b.adv.setAt && b.adv.setAt !== a.adv.setAt) out.push(`ตั้งโค้ช${cn(b.adv.coach)}จากกล่องจำลองในหน้าเว็บ`);
  b.adv.extra.filter(x => !a.adv.extra.some(y => y.id === x.id)).forEach(x => out.push(`เพิ่มโค้ช${cn(x.id)}จากกล่องจำลองในหน้าเว็บ`));
  return out.join(' · ');
}

/* the member website sits in a fixed dock over #dockslot, so re-rendering the back office never reloads it */
function placeDock() {
  const slot = $('#dockslot'), dock = $('#dock'), fr = $('#webframe');
  if (!slot) { dock.classList.remove('on'); return; }
  if (!fr.getAttribute('src')) { const url = FRONT_URL + '#intro=0&tier=' + slot.dataset.tier; fr.setAttribute('src', url); $('#dockopen').href = FRONT_URL; }
  const r = slot.getBoundingClientRect(), mr = $('main').getBoundingClientRect();
  Object.assign(dock.style, {left:(r.left - mr.left) + 'px', top:(r.top - mr.top) + 'px', width:r.width + 'px', height:r.height + 'px'});
  dock.classList.add('on');
}
window.addEventListener('resize', () => { if ($('#dockslot')) placeDock(); });

/* numbers count up when a page opens (like the member site) */
function countUp(root) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count, suf = el.dataset.suf || '', t0 = performance.now(), D = 900; if (!(to > 0)) return;
    const step = n => { const k = Math.min(1, (n - t0) / D); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suf; if (k < 1) requestAnimationFrame(step); else el.textContent = to + suf; }; requestAnimationFrame(step); });
}
/* logo reveal once per visit (like the member site) */
(() => { try { if (sessionStorage.getItem('boIntro') || /intro=0/.test(location.hash) || matchMedia('(prefers-reduced-motion: reduce)').matches) return; sessionStorage.setItem('boIntro', '1'); } catch (e) { return; }
  const el = document.createElement('div'); el.className = 'intro'; el.setAttribute('aria-hidden', 'true'); el.innerHTML = '<i class="il"></i><small>หลังบ้าน · MEMBER SYSTEM</small>'; document.body.appendChild(el);
  setTimeout(() => el.classList.add('out'), 1300); setTimeout(() => el.remove(), 2100); })();

  if (key !== render.key) { render.key = key; vw.classList.remove('enter'); void vw.offsetWidth; vw.classList.add('enter'); countUp(vw); clearTimeout(render.t); render.t = setTimeout(() => vw.classList.remove('enter'), 1400); }
  const lc = $('#lchat'); if (lc) lc.scrollTop = lc.scrollHeight;
  placeDock(); linkSave();
}
