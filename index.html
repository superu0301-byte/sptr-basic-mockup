<meta name="theme-color" content="#0b1222">
<style>
:root{--bg:#15171c;--bg2:#1b1e24;--bg3:#22252c;--bg4:#2a2e36;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);--ink:#e6e4df;--ink2:#b5b2ab;--mut:#9a978f;--gold:#d5b77c;--gold2:#ead7ab;--goldbg:rgba(213,183,124,.11);--goldln:rgba(213,183,124,.34);--live:#ef6f76;--green:#6fc9a3;--greenbg:rgba(111,201,163,.12);--purple:#ada0e6;--purplebg:rgba(173,160,230,.12);--blue:#86aee2;--bluebg:rgba(134,174,226,.12);--rose:#e8939f;--rosebg:rgba(232,147,159,.12);--glass:rgba(21,23,28,.8);--shadow:0 12px 30px rgba(0,0,0,.28);--btn:linear-gradient(135deg,#e2c690,#c6a462)}
[data-theme=light]{--bg:#f1eee7;--bg2:#faf8f3;--bg3:#f5f2ec;--bg4:#e8e3d8;--line:rgba(42,46,53,.08);--line2:rgba(42,46,53,.15);--ink:#2a2e35;--ink2:#4d535e;--mut:#5f6470;--gold:#7f5e1c;--gold2:#6a4e16;--goldbg:rgba(127,94,28,.09);--goldln:rgba(127,94,28,.32);--live:#b8323d;--green:#19704f;--greenbg:rgba(25,112,79,.09);--purple:#5b4bb0;--purplebg:rgba(91,75,176,.09);--blue:#2d5aa8;--bluebg:rgba(45,90,168,.08);--rose:#a8364f;--rosebg:rgba(168,54,79,.08);--glass:rgba(241,238,231,.86);--shadow:0 10px 28px rgba(42,46,53,.08)}
[data-theme=sepia]{--bg:#f3ead6;--bg2:#f8f1e1;--bg3:#efe5cd;--bg4:#e5d8bb;--line:rgba(74,58,34,.1);--line2:rgba(74,58,34,.18);--ink:#3a3125;--ink2:#584b3a;--mut:#6a5b47;--gold:#7a5716;--gold2:#654812;--goldbg:rgba(122,87,22,.1);--goldln:rgba(122,87,22,.34);--live:#a8333a;--green:#2b6546;--greenbg:rgba(43,101,70,.1);--purple:#5d4a9c;--purplebg:rgba(93,74,156,.1);--blue:#355a93;--bluebg:rgba(53,90,147,.09);--rose:#9e3a4c;--rosebg:rgba(158,58,76,.09);--glass:rgba(243,234,214,.88);--shadow:0 10px 28px rgba(74,58,34,.1)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Leelawadee UI","Leelawadee","Thonburi","Sukhumvit Set","Noto Sans Thai",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{line-height:1.35}
button{font-family:inherit;font-size:15px;cursor:pointer;color:inherit;background:none;border:none;padding:0}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg3);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--goldln)}
textarea{width:100%;resize:vertical;min-height:84px}
.ic{flex:none;display:inline-block;vertical-align:middle}
a{color:inherit}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hin{max-width:1280px;margin:0 auto;height:66px;padding:0 28px;display:flex;align-items:center;gap:28px}
.logo{display:flex;flex-direction:column;line-height:1;cursor:pointer;flex:none}
.logo .l1{font-size:10px;letter-spacing:.34em;color:var(--ink2);font-weight:700}
.logo .l2{font-family:Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:.16em;color:var(--gold);margin-top:3px}
.nav{display:flex;gap:4px}
.nav button{padding:8px 14px;border-radius:999px;color:var(--ink2);font-size:15.5px;display:flex;align-items:center;gap:8px}
.nav button:hover{color:var(--ink);background:var(--bg3)}
.nav button.on{color:var(--ink);background:var(--bg4)}
.nav .dotlive{width:7px;height:7px;border-radius:50%;background:var(--live)}
.hsp{flex:1}
.sbtn{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--mut);min-width:250px;font-size:15px}
.sbtn:hover{border-color:var(--line2)}
.sbtn kbd{margin-left:auto;font-family:inherit;font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--mut)}
.ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.ibtn:hover{background:var(--bg3);color:var(--ink)}
.ibtn .bdg{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--live);border:2px solid var(--bg)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e7c784,#9c7426);color:#1a1408;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.tabbar{display:none}

/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:32px 28px 96px}
.sec{margin-top:46px}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sh h2{font-size:21px;margin:0;letter-spacing:-.01em}
.sh .more{margin-left:auto;color:var(--ink2);font-size:14.5px;display:flex;align-items:center;gap:2px}
.sh .more:hover{color:var(--gold)}
.sh .sub{color:var(--mut);font-size:14.5px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:20px}
.pad{padding:20px 22px}
.muted{color:var(--mut)}
.ink2{color:var(--ink2)}
.gold{color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;background:var(--btn,linear-gradient(135deg,#d9bd84,#b8964f));color:#221a0b;white-space:nowrap}
.btn:hover{filter:brightness(1.04)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);font-weight:600}
.btn.ghost:hover{border-color:var(--goldln);color:var(--gold)}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.on{background:var(--greenbg);color:var(--green);border:1px solid transparent}
.btn.wlive{background:var(--live);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);font-size:14.5px}
.fchip:hover{color:var(--ink)}
.fchip.on{background:var(--goldbg);color:var(--gold);border-color:var(--goldln);font-weight:700}
.seg{display:inline-flex;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{padding:8px 16px;border-radius:999px;color:var(--ink2);font-size:15px;white-space:nowrap}
#wtabs .seg{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button.on{background:var(--bg2);color:var(--ink);box-shadow:0 1px 0 var(--line2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--bg4);color:var(--ink2)}
.tag.g{background:var(--goldbg);color:var(--gold)}
.tag.gr{background:var(--greenbg);color:var(--green)}
.tag.pu{background:var(--purplebg);color:var(--purple)}
.tag.bl{background:var(--bluebg);color:var(--blue)}
.tag.ro{background:var(--rosebg);color:var(--rose)}
/* basic recordings */
.recrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px}
.rchip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-size:13.5px}
.rchip:hover{border-color:var(--goldln)}
.rchip .ok{color:var(--green);display:inline-flex}
.rlink{color:var(--gold);font-size:14px;display:inline-flex;align-items:center;gap:2px;margin-left:4px}
.recbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.rsearch{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--line2);border-radius:999px;padding:0 14px;color:var(--mut)}
.rsearch input{flex:1;border:none;background:transparent;padding:10px 0}
.rhead{display:flex;align-items:center;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.rhead h3{margin:0;font-size:18px}
/* calendar */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:2px}
.calnav b{min-width:190px;text-align:center;font-size:16px}
.tchip{display:inline-flex;gap:8px;align-items:center}
.tchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tchip.off{opacity:.45;text-decoration:line-through}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wkd{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px 8px;min-height:280px}
.wkd.today{border-color:var(--goldln)}
.wkh{display:flex;align-items:baseline;gap:6px;padding:0 4px 8px}
.wkh span{color:var(--mut);font-size:13.5px}.wkh b{font-size:20px}
.wkd.today .wkh b{color:var(--gold)}
.wkd.today .wkh:after{content:"วันนี้";font-size:12px;color:var(--gold);margin-left:auto}
.evc{display:block;width:100%;text-align:left;border-radius:10px;padding:8px 9px 9px 12px;margin-bottom:6px;background:var(--bg3);border:1px solid var(--line);position:relative;overflow:hidden}
.evc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.evc:hover{border-color:var(--line2)}
.evc .tm{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.evc b{display:block;font-size:14px;line-height:1.35;margin-top:2px}
.evc .sb{font-size:12.5px;color:var(--mut);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evs{display:inline-flex;gap:4px;align-items:center;font-size:12px;margin:5px 4px 0 0;padding:1px 7px;border-radius:999px;background:var(--bg4);color:var(--ink2)}
.evs.ok{background:var(--greenbg);color:var(--green)}.evs.g{background:var(--goldbg);color:var(--gold)}
.evc.past{opacity:.5}
.livebadge.sm{font-size:10.5px;padding:1px 6px}
.mgrid2{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mh{font-size:13.5px;color:var(--mut);text-align:center;padding:4px 0}
.mc{display:flex;flex-direction:column;gap:3px;text-align:left;min-height:120px;padding:7px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);min-width:0}
.mc:hover{border-color:var(--line2)}
.mc.out{opacity:.38}
.mc .dn{font-weight:700;font-size:14.5px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.mc.today .dn{background:var(--gold);color:#1a1408}
.mc.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldbg)}
.mb{display:block;font-size:12.5px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mb em{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}
.more2{font-size:12.5px;color:var(--ink2);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}.dots i{width:6px;height:6px;border-radius:50%}
.evmeta{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:15px;margin-top:8px}
.livebadge{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;font-weight:700;font-size:12px;letter-spacing:.1em;padding:3px 9px;border-radius:6px}
.livebadge i{width:6px;height:6px;border-radius:50%;background:#fff}
@media (prefers-reduced-motion:no-preference){.livebadge i,.nav .dotlive{animation:pulse 2.6s ease-in-out infinite}html.fresh .drawline{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4s ease-out forwards}}
@keyframes pulse{50%{opacity:.45}}
@keyframes draw{to{stroke-dashoffset:0}}

/* thumbs & cards */
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0d1119}
.thumb svg.th{position:absolute;inset:0;width:100%;height:100%}
.thumb .dur{position:absolute;right:8px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.thumb .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
.thumb .prog i{display:block;height:100%;background:var(--gold)}
.thumb .ep{position:absolute;left:14px;top:12px;color:#fff}
.thumb .ep b{display:block;font-family:Georgia,serif;font-size:30px;letter-spacing:.04em;color:#f0d9a3;line-height:1}
.thumb .ep span{font-size:12.5px;opacity:.85}
.thumb .done{position:absolute;left:8px;bottom:10px;background:rgba(52,211,153,.92);color:#04241a;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center}
.thumb .sv{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.clip:hover .thumb .sv,.thumb .sv.on{opacity:1}
.thumb .sv.on{background:var(--gold);color:#1a1408}
@media (hover:none){.thumb .sv{opacity:1}}
.thumb .newb{position:absolute;left:8px;bottom:10px;background:var(--live);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.sr .thumb .sv,.plist .thumb .sv,.t5 .thumb .sv,.sr .thumb .newb,.plist .thumb .newb{display:none}
.clip{cursor:pointer;min-width:0}
.clip:hover .thumb{outline:2px solid var(--goldln);outline-offset:2px}
.clip .t{font-weight:700;font-size:15.5px;margin-top:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clip .m{color:var(--mut);font-size:13.5px;margin-top:4px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 54px)/4);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.gridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 20px}

/* home */
.greet{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.greet h1{font-size:30px;margin:0;letter-spacing:-.015em}
.greet .s{color:var(--ink2);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.greet .s span{display:inline-flex;gap:6px;align-items:center}
.hero{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;margin-top:22px}
.lbig{position:relative;border-radius:22px;overflow:hidden;min-height:380px;cursor:pointer;background:#0d1119}
.lbig svg.th{position:absolute;inset:0;width:100%;height:100%}
.lbig .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,12,.1) 20%,rgba(6,8,12,.92) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:26px;color:#fff}
.lbig h3{font-size:28px;margin:8px 0 4px;line-height:1.25}
.lmeta{display:flex;gap:16px;align-items:center;font-size:14.5px;color:rgba(255,255,255,.82);flex-wrap:wrap}
.lmeta span{display:inline-flex;gap:6px;align-items:center}
.lsm{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:#0d1119;flex:1;min-height:180px}
.lsm svg.th{position:absolute;inset:0;width:100%;height:100%}
.lsm .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,12,.05) 10%,rgba(6,8,12,.9) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;color:#fff}
.lsm b{font-size:16px;line-height:1.3}
.lsm .d{font-size:13.5px;color:rgba(255,255,255,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.coachs{display:flex;align-items:center}
.coachs .av{width:28px;height:28px;font-size:12.5px;border:2px solid #0d1119;margin-right:-6px}
.journey{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0}
.jl{padding:24px 26px;border-right:1px solid var(--line)}
.jr{padding:18px 22px;display:grid;gap:10px;align-content:center}
.steps{display:flex;align-items:flex-start;margin-top:22px}
.stp{flex:1;text-align:center;position:relative;font-size:13.5px;color:var(--mut)}
.stp:before{content:"";position:absolute;top:17px;left:-50%;right:50%;height:2px;background:var(--line2)}
.stp:first-child:before{display:none}
.stp.done:before,.stp.cur:before{background:var(--gold)}
.stp .c{width:36px;height:36px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line2);background:var(--bg2);position:relative;font-weight:700;font-size:12.5px}
.stp.done .c{background:var(--gold);border-color:var(--gold);color:#1a1408}
.stp.cur .c{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 5px var(--goldbg)}
.stp.done,.stp.cur{color:var(--ink)}
.stp b{display:block;font-size:14.5px}
.ji{display:flex;gap:12px;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ji .ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ji .tx{flex:1;min-width:0}
.ji .tx b{display:block;font-size:15px}
.ji .tx span{font-size:13.5px;color:var(--mut)}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.srow{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.dbox{border-radius:12px;background:var(--bg3);text-align:center;padding:6px 0;line-height:1.2}
.dbox b{display:block;font-size:19px}
.dbox span{font-size:12px;color:var(--mut)}
.srow .tt{font-weight:700;font-size:15.5px}
.srow .ss{font-size:13.5px;color:var(--mut)}
.chall{position:relative;overflow:hidden}
.chall .mini{height:120px;border-radius:14px;overflow:hidden;position:relative;background:#0d1119;margin:12px 0}
.chall .mini svg{position:absolute;inset:0;width:100%;height:100%}
.cd{display:flex;gap:8px}
.cd div{background:var(--bg3);border-radius:10px;padding:6px 10px;text-align:center;min-width:56px}
.cd b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.cd span{font-size:12px;color:var(--mut)}
.top5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.t5{display:flex;align-items:flex-end;cursor:pointer}
.t5 .n{width:58px;flex:none;text-align:right;font-family:Georgia,serif;font-size:96px;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--line2);margin-right:-14px;z-index:0}
.t5 .thumb{flex:1;z-index:1;aspect-ratio:3/4}
.t5:hover .n{-webkit-text-stroke-color:var(--gold)}

/* learn */
.phead h1{font-size:30px;margin:0 0 4px;letter-spacing:-.015em}
.phead p{color:var(--ink2);margin:0 0 18px}
.epb{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;padding:18px;align-items:center}
.epb+.epb{border-top:1px solid var(--line)}
.epb h3{margin:0 0 4px;font-size:18px}
.epitems{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.epi{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--mut)}
.epi b{display:block;font-size:14.5px;color:var(--ink)}
.coachg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.coach{padding:18px;cursor:pointer;text-align:left;display:block;width:100%}
.coach:hover{border-color:var(--goldln)}
.coach .av{width:54px;height:54px;font-size:22px}
.coach h4{margin:12px 0 2px;font-size:17px}

/* watch */
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px}
.player{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#05070a}
.player svg.th{position:absolute;inset:0;width:100%;height:100%}
.pbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(255,255,255,.25)}
.pctl{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.8));color:#fff}
.track{position:relative;height:5px;background:rgba(255,255,255,.22);border-radius:3px;cursor:pointer}
.track .f{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:3px}
.track .k{position:absolute;top:-3px;width:2px;height:11px;background:rgba(255,255,255,.55)}
.track .nm{position:absolute;top:-9px;width:9px;height:9px;border-radius:50%;background:#f0d9a3;transform:translateX(-4px);border:2px solid #05070a}
.prow{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:14px}
.prow .sp{flex:1}
.ptitle{display:flex;gap:16px;align-items:flex-start;margin-top:18px;flex-wrap:wrap}
.ptitle h1{font-size:23px;margin:0;line-height:1.35;flex:1;min-width:260px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.chap{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;align-items:center}
.chap:hover{background:var(--bg3)}
.chap.on{background:var(--goldbg)}
.chn{font-style:normal;font-weight:700;font-size:12.5px;color:var(--gold);margin-right:8px}
.chap .ts{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:14px}
.txl{padding:10px 12px;border-radius:12px;cursor:pointer;display:grid;grid-template-columns:62px 1fr;gap:12px;font-size:15px}
.txl:hover{background:var(--bg3)}
mark{background:var(--goldbg);color:var(--gold);border-radius:4px;padding:0 2px}
.nitem{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;align-items:start}
.plist .pi{display:grid;grid-template-columns:132px 1fr;gap:12px;padding:8px;border-radius:14px;cursor:pointer}
.plist .pi:hover{background:var(--bg3)}
.plist .pi.on{background:var(--goldbg)}
.plist .pi .t{font-size:14.5px;font-weight:700;line-height:1.35}
.plist .thumb .ep b{font-size:19px}.plist .thumb .ep span,.plist .thumb .done{display:none}.plist .thumb .ep{left:9px;top:7px}
.sr .thumb .ep,.sr .thumb .dur,.sr .thumb .done{display:none}
.chat{display:flex;flex-direction:column;height:100%}
.cmsgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;max-height:440px}
.cm b{color:var(--gold);margin-right:6px}
.cm.coachm b{color:var(--green)}

/* library */
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat .card{padding:16px 18px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13.5px;color:var(--mut)}
.cert{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.certc{border-radius:18px;padding:22px;border:1px solid var(--goldln);background:linear-gradient(135deg,var(--goldbg),transparent)}
.certc.lk{border-color:var(--line);background:var(--bg2);opacity:.7}

/* me */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .tx{flex:1}
.row .tx span{display:block;font-size:13.5px;color:var(--mut)}
.sw{width:44px;height:26px;border-radius:999px;background:var(--bg4);position:relative;flex:none;border:1px solid var(--line2)}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink2);transition:left .15s}
.sw.on{background:var(--gold);border-color:var(--gold)}
.sw.on i{left:20px;background:#1a1408}

/* overlays */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.spanel{width:680px;max-width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.sin{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sin input{flex:1;border:none;background:transparent;font-size:18px;padding:4px 0}
.sres{max-height:60vh;overflow-y:auto;padding:10px}
.sres h5{margin:10px 10px 6px;font-size:12.5px;color:var(--mut);font-weight:700;letter-spacing:.05em}
.sr{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 10px;border-radius:12px;cursor:pointer;align-items:center}
.sr:hover{background:var(--bg3)}
.sr .thumb{border-radius:8px}
.srt{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:10px;border-radius:12px;cursor:pointer;font-size:15px}
.srt:hover{background:var(--bg3)}
.npanel{position:fixed;z-index:50;top:62px;right:max(20px,calc((100vw - 1280px)/2 + 20px));width:380px;max-width:calc(100vw - 24px);background:var(--bg2);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:8px}
.nrow{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px;border-radius:12px;font-size:14.5px;cursor:pointer}
.nrow:hover{background:var(--bg3)}
.nrow .ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.mbox{width:520px;max-width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
.mbox h3{margin:0 0 6px;font-size:20px}
.fld{margin-top:14px}
.fld label{display:block;font-size:14px;color:var(--ink2);margin-bottom:6px;font-weight:700}
.err{color:var(--live);font-size:14px;margin-top:6px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.stars button{color:var(--mut);padding:2px}
.stars button.on{color:var(--gold)}
.drawer{position:fixed;z-index:70;right:0;top:0;bottom:0;width:430px;max-width:100vw;background:var(--bg2);border-left:1px solid var(--line2);box-shadow:var(--shadow);overflow-y:auto;padding:22px 24px}
.drawer h3{margin:0 0 4px;font-size:20px}
.chg{display:grid;grid-template-columns:1fr 20px 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.chg .o{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(255,71,87,.5)}
.newi{display:flex;gap:10px;padding:8px 0;font-size:15px;align-items:flex-start}
.newi .ic{color:var(--gold);margin-top:2px}
.chgbtn{position:fixed;left:20px;bottom:20px;z-index:40;background:var(--bg2);border:1px solid var(--goldln);color:var(--gold);border-radius:999px;padding:10px 16px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.mock{position:fixed;right:20px;bottom:20px;z-index:40;font-size:12.5px;color:var(--mut);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:var(--bg4);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--shadow);padding:11px 18px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;transition:all .2s;pointer-events:none;z-index:90;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* eye comfort */
svg.th{filter:saturate(.8)}
[data-theme=light] .thumb,[data-theme=sepia] .thumb{box-shadow:inset 0 0 0 1px var(--line)}
.kp,.qq,.txl{max-width:72ch}
.kp{line-height:1.75}

.row.wr{flex-wrap:wrap}.row.wr .tx{min-width:210px}
.eyer{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:95;width:420px;max-width:calc(100vw - 24px);display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--bg2);border:1px solid var(--goldln);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}

/* ===== SPTR theme: streaming experience in Super Trader colours (navy · royal blue · gold) ===== */
[data-theme=str]{--bg:#0b1222;--bg2:#111a2e;--bg3:#17223a;--bg4:#1f2b46;--line:rgba(160,185,255,.09);--line2:rgba(160,185,255,.18);--ink:#eef2fa;--ink2:#b7c0d4;--mut:#9aa6bd;--gold:#e3b857;--gold2:#f3d98f;--goldbg:rgba(227,184,87,.13);--goldln:rgba(227,184,87,.45);--live:#ff6b7d;--green:#56d68a;--greenbg:rgba(86,214,138,.12);--purple:#b69cff;--purplebg:rgba(182,156,255,.13);--blue:#7aa2ff;--bluebg:rgba(122,162,255,.14);--rose:#ff7a90;--rosebg:rgba(255,122,144,.12);--glass:rgba(11,18,34,.9);--shadow:0 18px 44px rgba(0,0,0,.5);--btn:linear-gradient(135deg,#f6d983,#d9a63f);--acc:#e3b857;--accink:#1a1408;--brand:#2459e0;--livebg:#d42f44;--artbg:#0d1a3a}

@media (max-width:600px){
  .stph{display:block;position:absolute;top:0;left:0;right:0;height:42%;z-index:-1;background:#e3b857;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
  .stpi{position:absolute;inset:0 0 6px 0;display:flex;background:#fff;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
  .stpi i{flex:1;background-size:auto 150%;background-position:50% 14%;background-repeat:no-repeat}.stph.duo .stpi i{background-size:auto 150%}
  .stage:has(.stph) .bbv{background:linear-gradient(0deg,rgba(8,14,32,.98) 0%,rgba(8,14,32,.9) 44%,rgba(8,14,32,0) 60%)}
  .stage .stc{min-height:calc((100vw - 32px) * 1.42);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:0 16px 18px}
  .bstage .stc{min-height:calc((100vw - 32px) * 1.42)}
  .bsnum{display:flex;flex-direction:column;align-items:center;margin:28px 0 auto;line-height:1}
  .bsnum b{font-family:Georgia,"Times New Roman",serif;font-size:96px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(180deg,#a8466d 0%,#d06f94 55%,#eeaac3 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  [data-theme=str] .bsnum b,[data-theme=dark] .bsnum b{background-image:linear-gradient(180deg,#fff 0%,#f3d98f 55%,#c99a3c 100%)}
  .bsnum small{margin-top:10px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.7);color:#9c3f62;font-size:13px;font-weight:700}

  .stage .stc .bblab{justify-content:center;font-size:12px}
  .stage .stc .bbt{font-size:34px;margin:6px 0 8px}
  .stage .stmeta{justify-content:center;font-size:13.5px}.stage .stco{display:none}
  .stage .bbbtn{flex-direction:column;width:100%;gap:10px;margin-top:16px!important}
  .stage .bbbtn .btn.xl{width:100%;flex:none;padding:12px;font-size:16px}
  .stage .bbres{display:none}
  .stage:not(.bstage) .stsel{position:absolute;top:10px;left:14px;right:14px;padding:0;z-index:3}
  .stage:not(.bstage) .stlist{gap:5px;overflow:visible}
  .stage:not(.bstage) .hsel{flex:1;min-width:0;height:24px;padding:0;border:none;border-radius:0;background:none;display:block;-webkit-backdrop-filter:none;backdrop-filter:none}
  .stage:not(.bstage) .hsel>span:not(.hsbar){display:none}
  .stage:not(.bstage) .hsel:before{content:"";position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:rgba(10,22,51,.28)}
  .stage:not(.bstage) .hsel.on:before{background:rgba(10,22,51,.4)}
  .stage:not(.bstage) .hsbar{top:10px;bottom:auto;height:3px;border-radius:2px}
  .stage:not(.bstage) .hsel:not(.on) .hsbar{display:none}
}
</style>

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let gid = 0;
const PINK_HUE = {'#d5b77c':'#d890aa', '#e2bd6a':'#d890aa', '#6cc5b8':'#c393c4', '#6fc9a3':'#c393c4', '#86aee2':'#a39cd6', '#ada0e6':'#a39cd6', '#e8939f':'#d890aa'};
function art(seed, hue, o = {}) {
  const blush = document.documentElement.dataset.theme === 'blush';
  if (blush) hue = PINK_HUE[hue] || hue;
  const wash = blush ? '#ecb3c6' : hue, dnS = blush ? 'rgba(150,110,130,.55)' : 'rgba(255,255,255,.35)', dnF = blush ? 'rgba(150,110,130,.4)' : 'rgba(255,255,255,.28)';
  const r = rng(seed), W = 320, H = 180, n = o.n || 24, id = 'g' + (++gid);
  let s = `<svg class="th" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">` + (o.bare ? '' : `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--artbg,#12151b)"/><stop offset="1" stop-color="${wash}" stop-opacity=".34"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`);
  for (let i = 1; i < 4 && !o.bare; i++) s += `<line x1="0" x2="${W}" y1="${H * i / 4}" y2="${H * i / 4}" stroke="${blush ? 'rgba(168,56,94,.07)' : 'rgba(255,255,255,.05)'}"/>`;
  let p = .3 + r() * .2; const trend = o.trend ?? .012, step = W / (n + 1), pts = [];
  for (let i = 0; i < n; i++) {
    const op = p, cl = Math.min(.9, Math.max(.1, p + (r() - .46) * .09 + trend)), hi = Math.max(op, cl) + r() * .035, lo = Math.min(op, cl) - r() * .035;
    const x = step * (i + 1), y = v => H * (1 - v) * .86 + H * .07, up = cl >= op;
    s += `<line x1="${x}" x2="${x}" y1="${y(hi)}" y2="${y(lo)}" stroke="${up ? hue : dnS}" stroke-width="1"/><rect x="${x - step * .28}" y="${y(Math.max(op, cl))}" width="${step * .56}" height="${Math.max(1.5, Math.abs(y(op) - y(cl)))}" rx="1" fill="${up ? hue : dnF}" opacity="${up ? .92 : .8}"/>`;
    pts.push(`${x},${y((op + cl) / 2)}`); p = cl;
  }
  s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${hue}" stroke-width="1.6" opacity=".55" ${o.live ? 'class="drawline"' : ''}/>`;
  return s + '</svg>';
}

function mkt() {
  const d = NOW.getDay(), m = NOW.getHours() * 60 + NOW.getMinutes(), dot = c => `<i style="background:${c};box-shadow:0 0 0 3px ${c}33"></i>`;
  if (d === 0 || d === 6) return dot('#8f8c86') + 'ตลาดหุ้นไทยปิด · วันหยุด';
  if (m >= 600 && m < 750) return dot('#5fbf96') + 'ตลาดหุ้นไทยเปิดอยู่ · รอบเช้าถึง 12:30';
  if (m >= 870 && m < 990) return dot('#5fbf96') + 'ตลาดหุ้นไทยเปิดอยู่ · รอบบ่ายถึง 16:30';

function journeyChart(ST = JB, p = .62, label = 'เส้นทาง Basic Technical: ผ่าน EP.1 แล้ว กำลังเรียน EP.2 ได้ 62 เปอร์เซ็นต์ ต่อไป EP.3 EP.4 และจบคอร์ส') {

      <polyline points="${ST.map((_, i) => `${X(i)},${Y[i]}`).join(' ')}" class="jpl todo"/><polyline points="${done.join(' ')}" class="jpl done"/><circle cx="${px}" cy="${py}" r="4" class="jnow"/>
      ${ST.map(([a, b, bs, st], i) => `<g class="jn ${st}" transform="translate(${X(i)},${Y[i]})">${st === 'cur' ? '<circle r="18" class="halo"/>' : ''}<circle r="${st === 'cur' ? 10 : 8}"/><text y="${st === 'cur' ? -22 : -16}" class="ja">${a}</text><text y="${st === 'cur' ? 32 : 28}" class="jb">${wide ? b : bs}</text></g>`).join('')}</svg>`; };

  }

      ['Duolingo','Streak รายวัน · เหรียญความสำเร็จ · ทดสอบสั้นหลังเรียน'],['Apple Fitness','วงแหวนเป้าหมายรายสัปดาห์'],['Coursera','เส้นทางคอร์ส · สรุปคลิป 30 วินาที'],
      ['Linear / Raycast','Ctrl K ค้นหาได้ทั้งคลิปและคำสั่ง · คีย์ลัด'],['Gmail','ปุ่ม "เลิกทำ" หลังการจอง บันทึก และเตือน'],['Google Calendar','มุมมองสัปดาห์ / เดือน · ซิงก์ปฏิทิน'],
      ['Robinhood / TradingView','สถานะตลาดเปิด-ปิด · ธีมมืดสำหรับดูกราฟ'],['Kindle / Apple Books','ธีมกระดาษสีครีม อ่านนานไม่ล้าตา'],['iOS Night Shift','แสงอุ่นลดแสงสีฟ้าตอนกลางคืน'],['Material Design (Dark)','พื้นเทาเข้มแทนดำสนิท ตัวหนังสือขาวนวล ลดอาการตัวหนังสือเรือง'],['Apple HIG · WCAG 2.2','ปุ่มแตะง่าย 44px · ใช้คีย์บอร์ดได้ทุกที่ · ปรับขนาดตัวอักษร · คอนทราสต์ผ่านมาตรฐาน · หน้าต่างเลื่อนขึ้นจากด้านล่างบนมือถือ']
    ].map(([a, b]) => `<div class="inspo"><b>${a}</b><span>${b}</span></div>`).join('')}</aside></div>`;
}

/* ---------- render ---------- */
function render() {
  hideBob();
  const oEl = document.querySelector('#ovl .ovl'), oSc = oEl ? oEl.scrollTop : 0, oKey = render.k;
  ACT = {}; seq = 0; gid = 0;
  renderChrome();
  const v = {home:S.tier === 'adv' ? vHome : vHomeBasic, ep:vEp, learn:vLearn, coach:vCoach, watch:vWatch, livewatch:vLiveWatch, live:S.tier === 'adv' ? vLive : vLiveBasic, library:vLibrary, me:vMe, hot:vHot}[S.view] || vHome;
  $('#view').innerHTML = v() + `<button class="chgbtn" data-a="${A(() => { S.changes = true; render(); })}">${ic('spark', 18)}<span class="lbl">ดูว่าเปลี่ยนอะไร</span></button><span class="mock tiersw" role="group" aria-label="มุมมองตัวอย่าง">Mockup · มุมมอง${[['basic','Basic'],['adv','Advance']].map(([k, l]) => `<button class="${S.tier === k ? 'on' : ''}" aria-pressed="${S.tier === k}" data-a="${A(() => setTier(k))}">${l}</button>`).join('')}</span>`;
  document.querySelectorAll('.nft').forEach(nfSync);
  document.body.classList.toggle('watching', S.view === 'watch');
  $('#ovl').innerHTML = (S.search ? searchHTML() : '') + (S.notif ? notifHTML() : '') + (S.modal ? modalHTML() : '') + (S.changes ? changesHTML() : '');
  render.k = S.modal + ':' + S.tid; if (render.k === oKey && oSc) { const n = document.querySelector('#ovl .ovl'); if (n) n.scrollTop = oSc; }
  const mc = S.mini && S.view !== 'watch' ? byClip(S.mini) : null;
  $('#mini').innerHTML = mc ? `<div class="minip" role="region" aria-label="คลิปที่ดูค้างไว้ กดเพื่อดูต่อ" data-go="watch:${mc.id}">${thumb(mc)}<div style="min-width:0"><div class="t">${esc(mc.title)}</div><div class="muted" style="font-size:12.5px;margin-top:2px">หยุดไว้ที่ ${mmss(S.pos[mc.id] ?? Math.round((mc.prog && mc.prog < 1 ? mc.prog : 0) * mc.dur * 60))} · แตะเพื่อดูต่อ</div></div><button class="ibtn" aria-label="ปิดมินิเพลเยอร์" data-a="${A(() => { S.mini = null; render(); })}">${ic('x', 18)}</button></div>` : '';
  document.body.classList.toggle('has-mini', !!mc);
  document.querySelectorAll('[data-go]:not(button):not(a),[data-a]:not(button):not(a):not(input):not(select):not(textarea)').forEach(el => { el.tabIndex = 0; if (!el.hasAttribute('role')) el.setAttribute('role', 'link'); });
  const dlg = document.querySelector('#ovl [role=dialog]');
  if (dlg) { dlg.setAttribute('aria-modal', 'true'); if (!S.search && !dlg.contains(document.activeElement)) { const f = dlg.querySelector('input,textarea,select,button:not([disabled])'); if (f) f.focus({preventScroll:true}); } }
  const cm = $('#cmsgs'); if (cm) cm.scrollTop = cm.scrollHeight;
  if (S.search) { const el = $('#sq'); if (el && document.activeElement !== el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  armNextUp();
}
(() => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('v')) S.view = h.get('v');
  if (h.get('id')) { if (S.view === 'watch') S.clip = h.get('id'); if (S.view === 'livewatch') S.live = h.get('id'); if (S.view === 'coach') S.coach = h.get('id'); if (S.view === 'ep') S.epn = +h.get('id'); }
  if (h.get('tab')) { if (S.view === 'learn') S.learn = h.get('tab'); if (S.view === 'library') S.lib = h.get('tab'); if (S.view === 'watch') S.wtab = h.get('tab'); }
  if (h.get('theme')) S.theme = h.get('theme');
  if (h.get('warm')) S.pref.warm = true;
  if (h.get('eye')) setTimeout(eyeRest, 300);
  if (h.get('fs')) S.fs = +h.get('fs');
  if (h.get('mini')) S.mini = h.get('mini');
  if (h.get('t') && S.view === 'watch') S.pos[S.clip] = +h.get('t');
  if (h.get('cc')) S.cc = true;
  if (h.get('q') != null) { S.search = true; S.q = h.get('q'); }
  if (h.get('changes')) S.changes = true;
  if (h.get('modal')) S.modal = h.get('modal');
  if (h.get('bview')) S.bview = h.get('bview');
  if (h.get('ep')) S.rep = +h.get('ep');
  if (h.get('cal')) S.calView = h.get('cal');
  if (h.get('ev')) { S.modal = 'ev'; S.evId = h.get('ev'); }
  if (h.get('hot')) S.hot = h.get('hot');
  if (h.get('tier')) S.tier = h.get('tier');
  if (h.get('title')) { S.modal = 'title'; S.tid = h.get('title'); }
  if (h.get('season')) S.season = h.get('season');
  if (h.get('intro') === '0') S.noIntro = true;
  if (h.get('day')) { const [mm, dd] = h.get('day').split('-').map(Number); S.bcDay = D(mm, dd); S.bcRef = D(mm, 1); }
  if (h.get('bk')) { S.modal = 'book'; S.evId = h.get('bk'); S.bf = {mode:'onsite', slot:h.get('slot') || '', topic:''}; }
  if (h.get('tk')) { S.modal = 'ticket'; S.evId = h.get('tk'); S.tkNew = h.get('new') === '1'; }
  if (h.get('lvf')) S.lvf = h.get('lvf');
})();
applyTier();
render();
if (!S.noIntro) intro();
if (!location.hash) { try { if (!sessionStorage.getItem('strGuide')) { sessionStorage.setItem('strGuide', '1'); setTimeout(() => { if (!S.modal) { S.modal = 'guide'; render(); } }, document.getElementById('intro') ? 2700 : 400); } } catch (e) {} }
setTimeout(() => document.documentElement.classList.remove('fresh'), 4500);
</script>
</body>
